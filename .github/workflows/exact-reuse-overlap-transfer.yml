name: Verify exact learned-repair overlap source
on:
  push:
    branches: [feat/exact-reuse-overlap-35x]
    paths: [.github/workflows/exact-reuse-overlap-transfer.yml]
permissions:
  contents: write
concurrency:
  group: sara-exact-reuse-overlap-transfer
  cancel-in-progress: false
jobs:
  qualify-and-publish-source:
    if: github.repository == 'BoneManTGRM/SARA' && github.actor == 'BoneManTGRM' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Identify only residual integration conflicts
        run: |
          set -euo pipefail
          test "$(git merge-base dd5fac4a4c39617579830ab35dd49600999116d5 HEAD)" = "dd5fac4a4c39617579830ab35dd49600999116d5"
          git diff --quiet dd5fac4a4c39617579830ab35dd49600999116d5 HEAD -- src/coding-repair-memory.ts src/kernel.ts src/reusable-coding-candidate-generator.ts src/types.ts tests/coding-repair-memory.test.ts tests/kernel-verification-pool.test.ts tests/reusable-coding-candidate-generator.test.ts docs/work-cards/exact-reuse-overlap.md
          set +e
          git apply --reject --recount transfer/exact-reuse-overlap.patch
          APPLY_STATUS=$?
          set -e
          echo "apply_status=$APPLY_STATUS"
          find src tests docs -name '*.rej' -type f -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
          echo '--- resulting target hashes ---'
          for f in docs/work-cards/exact-reuse-overlap.md src/coding-repair-memory.ts src/kernel.ts src/reusable-coding-candidate-generator.ts src/types.ts tests/coding-repair-memory.test.ts tests/kernel-verification-pool.test.ts tests/reusable-coding-candidate-generator.test.ts; do
            test -f "$f" && printf '%s %s\n' "$(git hash-object "$f")" "$f"
          done
          # Diagnostic run intentionally cannot publish source.
          exit 1
