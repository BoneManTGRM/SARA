name: Verify exact learned-repair overlap source
on:
  push:
    branches: [feat/exact-reuse-overlap-35x]
    paths: [.github/workflows/exact-reuse-overlap-transfer.yml]
permissions:
  contents: write
concurrency:
  group: sara-exact-reuse-overlap-transfer
  cancel-in-progress: false
jobs:
  qualify-and-publish-source:
    if: github.repository == 'BoneManTGRM/SARA' && github.actor == 'BoneManTGRM' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify frozen base and exact target source
        run: |
          set -euo pipefail
          test "$(git merge-base dd5fac4a4c39617579830ab35dd49600999116d5 HEAD)" = "dd5fac4a4c39617579830ab35dd49600999116d5"
          git diff --quiet dd5fac4a4c39617579830ab35dd49600999116d5 HEAD -- src/coding-repair-memory.ts src/kernel.ts src/reusable-coding-candidate-generator.ts src/types.ts tests/coding-repair-memory.test.ts tests/kernel-verification-pool.test.ts tests/reusable-coding-candidate-generator.test.ts docs/work-cards/exact-reuse-overlap.md
          # The target bytes are frozen below. Use GNU patch only to tolerate
          # integration-offset context in two PR126 files; exact hashes remain
          # the authority and qualification stops on any byte difference.
          patch --batch --forward --fuzz=3 -p1 < transfer/exact-reuse-overlap.patch
          test "$(git hash-object docs/work-cards/exact-reuse-overlap.md)" = 9ffda9255ee343e7750485b9273f943340b18478
          test "$(git hash-object src/coding-repair-memory.ts)" = adc6b909a86458fefd87b12f45cf964a980d49a9
          test "$(git hash-object src/kernel.ts)" = 796bfa0af0edd0c109299b433212facd1464f745
          test "$(git hash-object src/reusable-coding-candidate-generator.ts)" = e8fe88a5346ecc3ddb2d9a8c447e4a6358d3527a
          test "$(git hash-object src/types.ts)" = 3f8a9691e3e0d1725a0e2704e1580c20f0abcfac
          test "$(git hash-object tests/coding-repair-memory.test.ts)" = 06a50f79d59ea593e2c1fac85b87764fbefa526c
          test "$(git hash-object tests/kernel-verification-pool.test.ts)" = 1dac35707d39ee6ba86dffd32fbc7a28f40a7518
          test "$(git hash-object tests/reusable-coding-candidate-generator.test.ts)" = f2d29dd1d7b24127b430f0c0614dabf97a7b892c
          git add docs/work-cards/exact-reuse-overlap.md src/coding-repair-memory.ts src/kernel.ts src/reusable-coding-candidate-generator.ts src/types.ts tests/coding-repair-memory.test.ts tests/kernel-verification-pool.test.ts tests/reusable-coding-candidate-generator.test.ts
          git rm transfer/exact-reuse-overlap.patch
          git diff --cached --check
      - name: Install and run complete credential-free verification
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node scripts/build-native-checker.mjs
          npm run verify
      - name: Publish only the verified source changes
        run: |
          set -euo pipefail
          git config user.name 'Reparodynamics'
          git config user.email 'papadenico@yahoo.com'
          git status --short
          git commit -m 'Prototype exact learned-repair verification overlap'
          git push origin HEAD:feat/exact-reuse-overlap-35x
