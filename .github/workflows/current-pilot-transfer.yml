name: Verify current coding pilot launcher
on:
  push:
    branches: [verify/current-live-pilot-90add88e]
    paths: [.github/workflows/current-pilot-transfer.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'BoneManTGRM/SARA' && github.actor == 'BoneManTGRM' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Reconstruct exact reviewed pilot source
        run: |
          set -euo pipefail
          mkdir -p /tmp/current-pilot-verified
          echo '03b7fbcaa8387c170e023819662cb402e10f7528ed0154aaf711549ae5c97783  .sara-current-pilot-integration.patch' | sha256sum -c -
          cp src/coding-repair-benchmark-runner.ts src/current-coding-benchmark-runner.ts
          cp scripts/benchmark-matched-coding-evidence.ts scripts/benchmark-current-coding-evidence.ts
          git add src/current-coding-benchmark-runner.ts scripts/benchmark-current-coding-evidence.ts
          git apply --index .sara-current-pilot-integration.patch
          git rm .sara-current-pilot-integration.patch .github/workflows/current-pilot-transfer.yml
          test "$(git write-tree)" = 2bbb15f47db3574952f97c6df71a54c75040025f
      - run: npm ci --ignore-scripts
      - run: node scripts/build-native-checker.mjs
      - name: Full verification without provider credentials
        run: |
          set -euo pipefail
          npm run verify | tee /tmp/current-pilot-verified/verify.log
          git diff --exit-code
          test "$(git write-tree)" = 2bbb15f47db3574952f97c6df71a54c75040025f
      - name: Publish verified branch only, no live request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/verify/current-live-pilot-90add88e
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'SARA verified pilot source'
          git config user.email 'pilot-source@users.noreply.github.com'
          git commit -m 'Register owner-requested one-use current coding component pilot'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/verify/current-live-pilot-90add88e
          unset AUTH GH_TOKEN
          git rev-parse HEAD > /tmp/current-pilot-verified/commit.txt
          git rev-parse HEAD^{tree} > /tmp/current-pilot-verified/tree.txt
          git archive --format=tar HEAD | gzip -n > /tmp/current-pilot-verified/source.tar.gz
          cd /tmp/current-pilot-verified
          sha256sum source.tar.gz verify.log > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: current-coding-pilot-source-${{ github.run_id }}
          path: /tmp/current-pilot-verified/
          retention-days: 14
