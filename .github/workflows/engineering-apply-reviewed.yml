name: Apply exact reviewed engineering wave
on:
  push:
    branches: [codex/sara-engineering-reliability]
    paths: [.github/engineering-reviewed.bundle.json]
permissions:
  contents: write
concurrency:
  group: sara-engineering-reviewed-patch
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'BoneManTGRM/SARA' && github.ref == 'refs/heads/codex/sara-engineering-reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify exact patch and product identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, bz2, hashlib, json, pathlib, subprocess
          baseline = '05f6efae40d39827a97f9b46527fb6e3b98a1d52'
          transport = {'.github/engineering-reviewed.bundle.json', '.github/workflows/engineering-apply-reviewed.yml', '.github/workflows/engineering-source-snapshot.yml'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', baseline, 'HEAD'], text=True).splitlines())
          if changed - transport:
              raise SystemExit('Unexpected source change; reconciliation required')
          bundle = json.loads(pathlib.Path('.github/engineering-reviewed.bundle.json').read_text())
          if bundle['baseSha'] != baseline or bundle['treeSha'] != '7e25508c3985e40901c46d6efe65bd5860fdd673':
              raise SystemExit('Unexpected reviewed identity')
          patch = bz2.decompress(base64.b64decode(bundle['payload'], validate=True))
          if len(patch) != 158209 or hashlib.sha256(patch).hexdigest() != 'e47920d9aa83ba9ed16a3737aa2b731520a21b91dae52a5cc637b576e211183d':
              raise SystemExit('Patch integrity mismatch')
          pathlib.Path('/tmp/sara-engineering-reviewed.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/sara-engineering-reviewed.patch
          git apply --index /tmp/sara-engineering-reviewed.patch
          git rm .github/engineering-reviewed.bundle.json .github/workflows/engineering-apply-reviewed.yml .github/workflows/engineering-source-snapshot.yml
          test "$(git write-tree)" = 7e25508c3985e40901c46d6efe65bd5860fdd673
          git diff --cached --check
      - name: Prepare locked development toolchain
        run: |
          npm ci --ignore-scripts
          node scripts/build-native-checker.mjs
      - name: Verify engineering contracts and existing trust boundaries
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/engineering-capabilities.test.ts tests/engineering-adversarial.test.ts tests/engineering-runtime.test.ts tests/digital-schema-nullable.test.ts tests/digital-capability-substrate.test.ts tests/digital-capability-boundaries.test.ts tests/digital-capability-runtime-proof.test.ts tests/digital-capability-receipt-integrity.test.ts tests/capability-control-projection.test.ts tests/learned-capability-control.test.ts tests/production-state-fingerprint.test.ts tests/state-backup-restore.test.ts tests/procedural-intelligence.test.ts | tee /tmp/engineering-focused.tap
          npm run typecheck
      - name: Publish verified exact product commit to the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = 7e25508c3985e40901c46d6efe65bd5860fdd673
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement seventeen authority-bound engineering capabilities and runtime proof'
          test "$(git ls-remote origin refs/heads/codex/sara-engineering-reliability | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/sara-engineering-reliability
          git rev-parse HEAD > /tmp/ENGINEERING_COMMIT.txt
          git rev-parse HEAD^{tree} > /tmp/ENGINEERING_TREE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engineering-wave-verification
          path: |
            /tmp/ENGINEERING_COMMIT.txt
            /tmp/ENGINEERING_TREE.txt
            /tmp/engineering-focused.tap
          retention-days: 3
          if-no-files-found: error
