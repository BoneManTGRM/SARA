name: PR59 final release

on:
  push:
    branches:
      - automation/pr59-finalizer-20260904

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: pr59-final-release
  cancel-in-progress: true

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/telegram-nico-gmail-delivery
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install and verify the complete tree
        run: |
          npm ci
          npm run verify
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Require fresh exact-head CI and CodeQL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: BoneManTGRM/SARA
          PR_NUMBER: "59"
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          local_head="$(git rev-parse HEAD)"
          green=""
          for attempt in $(seq 1 90); do
            pr="$(curl --fail --silent --show-error "${auth[@]}" "$api/pulls/$PR_NUMBER")"
            test "$(jq -r '.state' <<<"$pr")" = "open"
            head="$(jq -r '.head.sha' <<<"$pr")"
            test "$head" = "$local_head"
            checks="$(curl --fail --silent --show-error "${auth[@]}" "$api/commits/$head/check-runs?per_page=100")"
            test_result="$(jq -r '[.check_runs[] | select(.name == "test")][-1].conclusion // "missing"' <<<"$checks")"
            codeql_result="$(jq -r '[.check_runs[] | select(.name == "CodeQL")][-1].conclusion // "missing"' <<<"$checks")"
            analyze_result="$(jq -r '[.check_runs[] | select(.name == "Analyze (javascript-typescript)")][-1].conclusion // "missing"' <<<"$checks")"
            incomplete="$(jq '[.check_runs[] | select(.status != "completed")] | length' <<<"$checks")"
            failures="$(jq '[.check_runs[] | select(.status == "completed" and (.conclusion | IN("failure", "cancelled", "timed_out", "action_required", "stale")))] | length' <<<"$checks")"
            if [ "$test_result" = "success" ] && [ "$codeql_result" = "success" ] && [ "$analyze_result" = "success" ] && [ "$incomplete" = "0" ] && [ "$failures" = "0" ]; then
              green="$head"
              break
            fi
            sleep 20
          done
          test "$green" = "$local_head"
          echo "GREEN_HEAD=$green" >> "$GITHUB_ENV"

      - name: Mark ready and merge the exact green head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: BoneManTGRM/SARA
          PR_NUMBER: "59"
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          test "$(curl --fail --silent --show-error "${auth[@]}" "$api/pulls/$PR_NUMBER" | jq -r '.head.sha')" = "$GREEN_HEAD"
          curl --fail --silent --show-error -X PATCH "${auth[@]}" "$api/pulls/$PR_NUMBER" -d '{"draft":false}' >/dev/null
          mergeable="null"
          for attempt in $(seq 1 20); do
            mergeable="$(curl --fail --silent --show-error "${auth[@]}" "$api/pulls/$PR_NUMBER" | jq -r '.mergeable')"
            [ "$mergeable" = "true" ] && break
            sleep 5
          done
          test "$mergeable" = "true"
          response="$(curl --fail --silent --show-error -X PUT "${auth[@]}" "$api/pulls/$PR_NUMBER/merge" -d "$(jq -nc --arg sha "$GREEN_HEAD" '{sha:$sha,merge_method:"squash"}')")"
          test "$(jq -r '.merged' <<<"$response")" = "true"
          jq -e '.sha | strings | length == 40' <<<"$response" >/dev/null
