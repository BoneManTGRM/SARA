name: Apply bounded 20-per-day learning upgrade

on:
  push:
    branches:
      - codex/learning-20-per-day-20260911

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[learning-20-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded learning-rate change
        run: |
          python3 <<'PY'
          from pathlib import Path

          def exact_replace(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old!r}")
              p.write_text(text.replace(old, new, expected))

          exact_replace(
              'src/learning-campaign.ts',
              'export const LEARNING_DAILY_RESERVATION_LIMIT = 10;',
              'export const LEARNING_DAILY_RESERVATION_LIMIT = 20;',
          )
          exact_replace(
              'src/server.ts',
              'allowedServiceIds:["skill-learning"],maximumCostPerActionUsd:0,maximumConcurrentActions:1,maximumDailyActions:10,',
              'allowedServiceIds:["skill-learning"],maximumCostPerActionUsd:0,maximumConcurrentActions:1,maximumDailyActions:20,',
          )
          exact_replace(
              'src/dashboard.ts',
              "const needsRateUpgrade = compatible && Number(ownerMandate.maximumDailyActions || 0) < 10;",
              "const needsRateUpgrade = compatible && Number(ownerMandate.maximumDailyActions || 0) < 20;",
          )
          exact_replace(
              'src/dashboard.ts',
              "button.textContent = needsRateUpgrade ? 'Upgrade learning mandate to 10/day'",
              "button.textContent = needsRateUpgrade ? 'Upgrade learning mandate to 20/day'",
          )
          exact_replace(
              'tests/model-budget.test.ts',
              'assert.equal(mandate.maximumCostPerActionUsd,0);assert.equal(mandate.maximumDailyActions,10);',
              'assert.equal(mandate.maximumCostPerActionUsd,0);assert.equal(mandate.maximumDailyActions,20);',
          )
          exact_replace(
              'tests/learning-campaign.test.ts',
              'allowedChannels:["internal"],allowedServiceIds:["skill-learning"],maximumCostPerActionUsd:0,maximumDailyActions:10,maximumConcurrentActions:1,',
              'allowedChannels:["internal"],allowedServiceIds:["skill-learning"],maximumCostPerActionUsd:0,maximumDailyActions:20,maximumConcurrentActions:1,',
          )
          exact_replace(
              'tests/autonomous-learning.test.ts',
              'maximumCostPerActionUsd:0,maximumConcurrentActions:1,maximumDailyActions:10,',
              'maximumCostPerActionUsd:0,maximumConcurrentActions:1,maximumDailyActions:20,',
          )
          exact_replace(
              'tests/autonomous-learning.test.ts',
              'for(let index=0;index<7;index++){\n      await enqueue(kernel,6+index);',
              'for(let index=0;index<17;index++){\n      await enqueue(kernel,6+index);',
          )
          exact_replace(
              'tests/autonomous-learning.test.ts',
              'await enqueue(kernel,20);\n    assert.equal((await kernel.runNextAutonomousLearningCycle(generator)).status,"blocked");\n    assert.equal(calls,10);',
              'await enqueue(kernel,30);\n    assert.equal((await kernel.runNextAutonomousLearningCycle(generator)).status,"blocked");\n    assert.equal(calls,20);',
          )
          PY
      - name: Build native checker
        run: node scripts/build-native-checker.mjs
      - name: Verify repository
        run: npm run verify
      - name: Commit verified source change
        run: |
          git config user.name "Reparodynamics"
          git config user.email "papadenico@yahoo.com"
          git add src/learning-campaign.ts src/server.ts src/dashboard.ts tests/model-budget.test.ts tests/learning-campaign.test.ts tests/autonomous-learning.test.ts
          git diff --cached --check
          git commit -m "Raise bounded learning mandate to 20 per day [learning-20-applied]"
          git push origin HEAD:codex/learning-20-per-day-20260911
