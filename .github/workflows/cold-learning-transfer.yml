name: Verify exact cold learning coordination
on:
  push:
    branches: [perf/coalesce-cold-repairs-20260906]
    paths: [.github/workflows/cold-learning-transfer.yml]
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'BoneManTGRM/SARA' && github.actor == 'BoneManTGRM' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Apply the digest-bound candidate
        run: |
          set -euo pipefail
          mkdir -p /tmp/sara-cold-transfer
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          parts=[pathlib.Path('.sara-cold-transfer')/('part'+str(i)) for i in range(2)]
          encoded=''.join(p.read_text(encoding='ascii') for p in parts)
          assert len(encoded)==15396
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==42695
          assert hashlib.sha256(patch).hexdigest()=='555b06f61de7375ccdbc15feb99e03b4cdfb38c3e90e96f45f8f5f9aefe9bdf7'
          pathlib.Path('/tmp/sara-cold-transfer/candidate.patch').write_bytes(patch)
          PY
          git apply --index /tmp/sara-cold-transfer/candidate.patch
          git rm .github/workflows/cold-learning-transfer.yml .sara-cold-transfer/part0 .sara-cold-transfer/part1
          test "$(git write-tree)" = f3403c98558bc789f39e07dba85bebc71d2eba85
          test -z "$(git ls-files node_modules)"
      - run: npm ci --ignore-scripts
      - name: Verify without provider or owner credentials
        run: |
          set -euo pipefail
          npm run verify | tee /tmp/sara-cold-transfer/verify.log
          git diff --exit-code
          test "$(git write-tree)" = f3403c98558bc789f39e07dba85bebc71d2eba85
      - name: Publish only this verified branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = BoneManTGRM/SARA
          test "$GITHUB_REF" = refs/heads/perf/coalesce-cold-repairs-20260906
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'SARA verified source transfer'
          git config user.email 'source-transfer@users.noreply.github.com'
          git commit -m 'Coordinate identical cold repair learning without sharing verification or budget'
          test "$(git rev-parse HEAD^{tree})" = f3403c98558bc789f39e07dba85bebc71d2eba85
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/perf/coalesce-cold-repairs-20260906
          unset AUTH GH_TOKEN
          git rev-parse HEAD > /tmp/sara-cold-transfer/commit.txt
          git rev-parse HEAD^{tree} > /tmp/sara-cold-transfer/tree.txt
          git archive --format=tar HEAD | gzip -n > /tmp/sara-cold-transfer/source.tar.gz
          cd /tmp/sara-cold-transfer
          sha256sum candidate.patch source.tar.gz verify.log > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sara-cold-learning-transfer-${{ github.run_id }}
          path: /tmp/sara-cold-transfer/
          if-no-files-found: error
          retention-days: 14
