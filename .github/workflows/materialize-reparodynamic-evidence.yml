name: Materialize Reparodynamic evidence sources

on:
  push:
    branches:
      - feature/reparodynamic-evidence-gates
    paths:
      - .github/sara/reparodynamic-evidence-payload/**
      - .github/workflows/materialize-reparodynamic-evidence.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'BoneManTGRM/SARA' && github.ref == 'refs/heads/feature/reparodynamic-evidence-gates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and materialize exact evidence files
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/reparodynamic-evidence.tar.gz
          cat .github/sara/reparodynamic-evidence-payload/part-* | base64 --decode > "$archive"
          echo 'e86beccd0c88d4b1947bd1191b97f31a599ce29fc87679ac8c4421b81c74a5d3  /tmp/reparodynamic-evidence.tar.gz' | sha256sum --check --strict
          actual="$(tar -tzf "$archive" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            src/coding-repair-benchmark.ts \
            src/coding-repair-evidence-store.ts \
            src/coding-repair-evidence.ts \
            tests/coding-repair-benchmark.test.ts \
            tests/coding-repair-evidence-store.test.ts \
            tests/coding-repair-evidence.test.ts | LC_ALL=C sort)"
          test "$actual" = "$expected"
          tar -xzf "$archive"
          rm -rf .github/sara/reparodynamic-evidence-payload
          rm .github/workflows/materialize-reparodynamic-evidence.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: enforce statistical Reparodynamic rollout gates'
          git push origin HEAD:feature/reparodynamic-evidence-gates
