name: SARA fair benchmark integration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/reparodynamic-ab-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts
      - name: Check protected source and both original histories
        run: |
          git diff --exit-code f547b92ad6b55ec5fe50d2ae657442495c7592ac HEAD -- src/main.ts src/server.ts src/kernel.ts src/store.ts src/policy.ts src/coding-repair-controller.ts src/coding-repair-policy.ts scripts/start-runtime.ts scripts/benchmark-reparodynamic-coding.ts railway.json constitution package-lock.json
          git merge-base --is-ancestor f547b92ad6b55ec5fe50d2ae657442495c7592ac HEAD
          git merge-base --is-ancestor 60206bc105c107f5c9eee9c859a4fa1e41a2113a HEAD
          git diff --check
      - name: Locked full repository verification
        run: |
          set +e
          npm run verify > verification.log 2>&1
          code=$?
          printf '%s\n' "$code" > verification-exit.txt
          exit "$code"
      - name: Existing V7 scripted cases
        run: node --import tsx proof/reparodynamic-first-edits-v7.ts > v7-proof.jsonl 2>&1
      - name: Repeat HTTP boundaries
        run: |
          set +e
          npm run proof:http > http-repeat.log 2>&1
          code=$?
          printf '%s\n' "$code" > http-repeat-exit.txt
          exit "$code"
      - name: Archive exact source and partial evidence
        if: always()
        run: |
          git rev-parse HEAD > commit.txt
          git rev-parse HEAD^{tree} > tree.txt
          git archive --format=tar.gz HEAD > source.tar.gz
          sha256sum source.tar.gz > source.sha256
          node --version > node-version.txt
          npm ls --depth=0 > dependency-versions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sara-fair-benchmark-${{ github.event.pull_request.head.sha }}
          path: |
            verification.log
            verification-exit.txt
            v7-proof.jsonl
            http-repeat.log
            http-repeat-exit.txt
            commit.txt
            tree.txt
            source.tar.gz
            source.sha256
            node-version.txt
            dependency-versions.txt
          if-no-files-found: error
  security:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/reparodynamic-ab-evidence'
    name: Exact-head CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
