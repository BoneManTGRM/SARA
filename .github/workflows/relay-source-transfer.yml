name: One-use benchmark relay source transfer
on:
  push:
    branches: [maintenance/benchmark-relay-transfer-20260905]
    paths: [.github/workflows/relay-source-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'BoneManTGRM/SARA' && github.run_attempt == 1 && github.run_number == 2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a8ef0213cd7d173772cc41e76d35b6df3d3cb09e
          persist-credentials: true
      - name: Reconstruct exact tested source without running application or model code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')=='a8ef0213cd7d173772cc41e76d35b6df3d3cb09e'
          assert git('rev-parse','HEAD^{tree}')=='c390ed22660ace3dadf0ccb14d65c338976d0e97'
          url='https://api.github.com/repos/BoneManTGRM/SARA/git/blobs/7310ce31276ddbbd9754b982624a751ba3ea69d5'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as r: value=json.loads(r.read(32768))
          patch=base64.b64decode(value['content'])
          assert hashlib.sha256(patch).hexdigest()=='628d64b7d8baa9c1204b17b133a4c50e6b50a9e5e533b018f0bcf5ffe43b4bf8'
          out=pathlib.Path('/tmp/sara-issuer-source');out.mkdir()
          (out/'issuer.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check',str(out/'issuer.patch')],check=True)
          subprocess.run(['git','apply','--index',str(out/'issuer.patch')],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())=={'src/coding-benchmark-github-relay.ts','tests/coding-benchmark-github-relay.test.ts','docs/CODING_BENCHMARK_GITHUB_RELAY.md'}
          tree=git('write-tree');assert tree=='10f14cb83dafdf43b18b6dc268fe5756de1b9eec'
          subprocess.run(['git','config','user.name','SARA owner-authorized source transfer'],check=True)
          subprocess.run(['git','config','user.email','235159333+BoneManTGRM@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Accept exact self-workflow identity pairs observed in real GitHub tokens'],check=True)
          commit=git('rev-parse','HEAD')
          (out/'source.json').write_text(json.dumps({'commit':commit,'tree':tree,'base':'a8ef0213cd7d173772cc41e76d35b6df3d3cb09e','applicationExecution':False,'modelRequests':0},indent=2)+'\n')
          subprocess.run(['git','archive','--format=tar.gz','--prefix=SARA/',f'--output={out}/source.tar.gz','HEAD'],check=True)
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in sorted(out.iterdir()) if f.is_file()))
          subprocess.run(['git','push','origin','HEAD:refs/heads/fix/coding-benchmark-issuer-contract-20260905'],check=True)
          print(json.dumps({'candidateCommit':commit,'tree':tree,'modelRequests':0}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sara-benchmark-issuer-source
          path: /tmp/sara-issuer-source
          if-no-files-found: error
          retention-days: 7
