name: Build learning upgrade source

on:
  push:
    branches:
      - codex/learning-capacity-quality-20260910

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[learning-upgrade-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/learning-capacity-quality-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Materialize bounded learning changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          source = Path('.github/workflows/apply-learning-capacity-quality.yml').read_text()
          match = re.search(r"run: \|\n          python3 <<'PY'\n(.*?)\n          PY", source, re.S)
          if not match:
              raise SystemExit('Could not extract learning source transformation.')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in match.group(1).splitlines())
          Path('/tmp/learning-transform.py').write_text(script)
          PY
          python3 /tmp/learning-transform.py
          python3 <<'PY'
          from pathlib import Path
          p=Path('tests/model-budget.test.ts')
          text=p.read_text()
          old='assert.equal(mandate.maximumCostPerActionUsd,0);assert.equal(mandate.maximumDailyActions,2);'
          new='assert.equal(mandate.maximumCostPerActionUsd,0);assert.equal(mandate.maximumDailyActions,10);'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one learning mandate expectation, found {text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Build native checker
        run: node scripts/build-native-checker.mjs
      - name: Verify full repository
        run: npm run verify
      - name: Commit source only
        shell: bash
        run: |
          git config user.name "Reparodynamics"
          git config user.email "papadenico@yahoo.com"
          git add src/learning-campaign.ts src/kernel.ts src/learning-acceleration.ts src/server.ts src/dashboard.ts tests/learning-acceleration.test.ts tests/learning-campaign.test.ts tests/autonomous-learning.test.ts tests/model-budget.test.ts
          git diff --cached --check
          git commit -m "Increase bounded learning capacity and iterative quality [learning-upgrade-applied]"
          git push origin HEAD:codex/learning-capacity-quality-20260910
