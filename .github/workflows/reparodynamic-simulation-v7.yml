name: V7 credential-free simulations
on:
  pull_request:
    branches: [experiment/reparodynamic-efficiency-v6]
permissions:
  contents: read
jobs:
  simulation:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/reparodynamic-first-edits-v7'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --import tsx --test tests/coding-repair-first-edits-v7.test.ts tests/coding-repair-edits-v6.test.ts
      - run: npm run proof:reparodynamic-first-edits-v7 --silent > simulation-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: v7-simulation-${{ github.event.pull_request.head.sha }}
          path: simulation-results.json
          if-no-files-found: error
  security:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/reparodynamic-first-edits-v7'
    name: Exact-head CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
