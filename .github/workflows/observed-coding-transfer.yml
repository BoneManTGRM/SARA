name: Verify exact observed coding hardening source
on:
  push:
    branches: [fix/observed-coding-68990425]
    paths: [.github/workflows/observed-coding-transfer.yml]
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'BoneManTGRM/SARA' && github.actor == 'BoneManTGRM' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Reconstruct exact readable source without invoking providers
        run: |
          set -euo pipefail
          mkdir -p /tmp/sara-observed-transfer
          cat .sara-observed-transfer/patch0 .sara-observed-transfer/patch1 > /tmp/sara-observed-transfer/integration.patch
          echo '7a6b4d613634d433e383a06d9b8a6ea2addf57a0962fce80eef9588dd9823d6d  /tmp/sara-observed-transfer/integration.patch' | sha256sum -c -
          cp src/reuse-speed-benchmark.ts src/observed-reuse-benchmark.ts
          cp scripts/benchmark-hardened-reuse.ts scripts/benchmark-observed-reuse.ts
          cp tests/hardened-reuse-grant.test.ts tests/observed-reuse-grant.test.ts
          cp tests/native-coding-http.test.ts tests/self-build-http-timing-integration.test.ts
          git apply --unidiff-zero /tmp/sara-observed-transfer/integration.patch
          git add src scripts tests docs
          git rm .sara-observed-transfer/patch0 .sara-observed-transfer/patch1 .github/workflows/observed-coding-transfer.yml
          test "$(git write-tree)" = 6f789aa4e8bab2b9dab88293185f132056f0d5cc
          test -z "$(git ls-files node_modules)"
      - run: npm ci --ignore-scripts
      - run: node scripts/build-native-checker.mjs
      - name: Verify complete candidate with no provider credentials
        run: |
          set -euo pipefail
          npm run verify | tee /tmp/sara-observed-transfer/verify.log
          git diff --exit-code
          test "$(git write-tree)" = 6f789aa4e8bab2b9dab88293185f132056f0d5cc
      - name: Publish only the verified branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = BoneManTGRM/SARA
          test "$GITHUB_REF" = refs/heads/fix/observed-coding-68990425
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'SARA verified source transfer'
          git config user.email 'source-transfer@users.noreply.github.com'
          git commit -m 'Account for uncertain dispatches and measure the outer self-build boundary'
          test "$(git rev-parse HEAD^{tree})" = 6f789aa4e8bab2b9dab88293185f132056f0d5cc
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/observed-coding-68990425
          unset AUTH GH_TOKEN
          git rev-parse HEAD > /tmp/sara-observed-transfer/commit.txt
          git rev-parse HEAD^{tree} > /tmp/sara-observed-transfer/tree.txt
          git archive --format=tar HEAD | gzip -n > /tmp/sara-observed-transfer/source.tar.gz
          cd /tmp/sara-observed-transfer
          sha256sum source.tar.gz verify.log integration.patch > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sara-observed-coding-source-${{ github.run_id }}
          path: /tmp/sara-observed-transfer/
          retention-days: 14
          if-no-files-found: error
