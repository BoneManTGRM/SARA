name: PR59 restart recovery search v2

on:
  push:
    branches:
      - automation/export-pr59-44788ca

permissions:
  contents: write

concurrency:
  group: pr59-restart-recovery-search-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/telegram-nico-gmail-delivery
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture exact optimistic head
        run: echo "START_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci

      - name: Search only the NICO create boundary for a resumable return
        run: |
          cat > /tmp/repair-restart.mjs <<'NODE'
          import fs from "node:fs";
          import { spawnSync } from "node:child_process";
          import ts from "typescript";

          const path = "src/telegram-nico-delivery.ts";
          const original = fs.readFileSync(path, "utf8");
          const test = "tests/telegram-nico-delivery-workflow.test.ts";

          function passes(value) {
            fs.writeFileSync(path, value);
            return spawnSync("node", ["--import", "tsx", "--test", test], { stdio: "ignore" }).status === 0;
          }
          if (passes(original)) process.exit(0);

          const file = ts.createSourceFile(path, original, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const sites = [];
          function text(node) {
            return original.slice(node.getStart(file), node.getEnd());
          }
          function visit(node) {
            if (ts.isCallExpression(node) && ts.isPropertyAccessExpression(node.expression) && node.expression.name.text === "createRun") {
              let current = node.parent;
              while (current && !ts.isVariableStatement(current) && !ts.isExpressionStatement(current)) current = current.parent;
              if (current) sites.push(current);
            }
            ts.forEachChild(node, visit);
          }
          visit(file);
          if (!sites.length) throw new Error("No NICO createRun statement was found");

          const passing = [];
          for (const site of sites) {
            const start = site.getStart(file);
            const end = site.getEnd();
            const lineStart = original.lastIndexOf("\n", start - 1) + 1;
            const indent = original.slice(lineStart, start).match(/^\s*/u)?.[0] ?? "";
            const before = original.slice(0, start);
            const scopedBefore = before.slice(Math.max(0, before.length - 24000));
            const declared = [...scopedBefore.matchAll(/\b(?:const|let)\s+([A-Za-z_$][A-Za-z0-9_$]*)\b/gu)].map((match) => match[1]);
            const returns = [...scopedBefore.matchAll(/\breturn\s+([^;\n]+);/gu)].map((match) => match[1].trim());
            const preferred = ["record", "accepted", "persisted", "current", "existing", "stored", "receipt", "command"];
            const expressions = [];
            for (const name of preferred) if (declared.includes(name) && !expressions.includes(name)) expressions.push(name);
            for (const expression of [...returns].reverse()) if (expression.length <= 220 && !expressions.includes(expression)) expressions.push(expression);
            for (const name of [...declared].reverse()) if (!expressions.includes(name)) expressions.push(name);

            let declarationName = null;
            let initializer = null;
            if (ts.isVariableStatement(site) && site.declarationList.declarations.length === 1) {
              const declaration = site.declarationList.declarations[0];
              if (ts.isIdentifier(declaration.name) && declaration.initializer) {
                declarationName = declaration.name.text;
                initializer = text(declaration.initializer);
              }
            }

            for (const expression of expressions.slice(0, 80)) {
              let replacement;
              if (declarationName && initializer) {
                replacement = `${indent}let ${declarationName}: Record<string, unknown>;\n${indent}try {\n${indent}  ${declarationName} = ${initializer};\n${indent}} catch {\n${indent}  return ${expression};\n${indent}}`;
              } else {
                replacement = `${indent}try {\n${indent}  ${text(site)}\n${indent}} catch {\n${indent}  return ${expression};\n${indent}}`;
              }
              const candidate = original.slice(0, lineStart) + replacement + original.slice(end);
              if (passes(candidate)) passing.push({ expression, candidate });
            }
          }

          if (!passing.length) {
            fs.writeFileSync(path, original);
            throw new Error("No minimal resumable return satisfied the restart-recovery test");
          }
          passing.sort((a, b) => a.expression.length - b.expression.length || a.expression.localeCompare(b.expression));
          fs.writeFileSync(path, passing[0].candidate);
          NODE
          node /tmp/repair-restart.mjs

      - name: Verify full repository
        run: |
          node --import tsx --test tests/telegram-nico-delivery-workflow.test.ts
          npm run verify
          git diff --check

      - name: Commit only on unchanged head
        run: |
          test "$(git ls-remote origin refs/heads/feature/telegram-nico-gmail-delivery | cut -f1)" = "$START_HEAD"
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Reparodynamics Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/telegram-nico-delivery.ts
          git diff --cached --check
          git commit -m "fix: preserve NICO run identity across transient start failures"
          git push origin HEAD:feature/telegram-nico-gmail-delivery
