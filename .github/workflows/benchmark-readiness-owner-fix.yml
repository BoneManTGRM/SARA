name: Benchmark owner authentication review repair
on:
  push:
    branches: [fix/coding-benchmark-readiness-20260905]
    paths: [.github/workflows/benchmark-readiness-owner-fix.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'BoneManTGRM/SARA' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed delta and check complete source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 628addc5618ac78ab9cab685ba58da9cfb6f6536
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/server.ts')
          s = p.read_text()
          old = '''    // Both paths use the existing owner authentication above. Never put owner
              // or model credentials in a response, URL, evidence file, or child solution.
              const status = await kernel.getStatus();'''
          new = '''    // Preserve both existing authentication layers, even if server and kernel
              // configuration disagree. Never expose credentials in response/evidence.
              kernel.authenticateOwnerToken(token);
              const status = await kernel.getStatus();'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          p = Path('tests/coding-benchmark-owner-http.test.ts')
          p.write_text(p.read_text() + '''
          
          it("benchmark owner routes also require the kernel's authenticated owner, not only server configuration", async () => {
            const directory = await mkdtemp(join(tmpdir(), "sara-benchmark-owner-mismatch-"));
            const realToken = "kernel-owner-fixture";
            const mismatchedToken = "server-only-owner-fixture";
            const kernel = await SaraKernel.boot({ stateDirectory: directory, ownerTokenSha256: sha256(realToken) });
            const server = createSaraServer(kernel, { ownerTokenSha256: sha256(mismatchedToken), stateDirectory: directory });
            try {
              await new Promise<void>(resolve => server.listen(0, "127.0.0.1", resolve));
              const base = `http://127.0.0.1:${(server.address() as AddressInfo).port}`;
              const headers = { authorization: `Bearer ${mismatchedToken}`, "content-type": "application/json" };
              for (const [path, method] of [["/api/coding-benchmark/readiness", "GET"], ["/api/coding-benchmark/run", "POST"]]) {
                const response = await fetch(base + path, { method, headers });
                assert.equal(response.status, 403);
                assert.equal((await response.json() as { code: string }).code, "OWNER_AUTHENTICATION_FAILED");
              }
            } finally {
              await new Promise<void>(resolve => server.close(() => resolve()));
              await rm(directory, { recursive: true, force: true });
            }
          });
          ''')
          PY
          git add src/server.ts tests/coding-benchmark-owner-http.test.ts
          git rm .github/workflows/benchmark-readiness-capture.yml .github/workflows/benchmark-readiness-publish.yml .github/workflows/benchmark-readiness-owner-fix.yml
          test "$(git write-tree)" = a6434a8e2ea8b5c7ba41f7a7c850660f19686319
          git diff --cached --check
          npm ci --ignore-scripts --no-audit --no-fund
          node --import tsx --test tests/coding-benchmark-owner-http.test.ts
          npm run typecheck
          git restore --source="$GITHUB_SHA" --staged --worktree .github/workflows/benchmark-readiness-capture.yml .github/workflows/benchmark-readiness-publish.yml .github/workflows/benchmark-readiness-owner-fix.yml
      - name: Publish reviewed source changes to own branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'SARA readiness verification'
          git config user.email 'noreply@users.noreply.github.com'
          git commit -m 'Require the existing kernel owner identity on benchmark routes'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          test "$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" ls-remote origin refs/heads/fix/coding-benchmark-readiness-20260905 | cut -f1)" = "$GITHUB_SHA"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/coding-benchmark-readiness-20260905
