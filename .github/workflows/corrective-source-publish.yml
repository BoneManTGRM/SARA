name: SARA corrective source publish
on:
  push:
    branches: [maintenance/corrective-source-20260905]
    paths: [.github/workflows/corrective-source-publish.yml]
permissions:
  contents: write
concurrency:
  group: sara-corrective-source-20260905
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'BoneManTGRM/SARA' && github.ref == 'refs/heads/maintenance/corrective-source-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact pre-correction main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 195b2e379b0644bd27581fd7452ddff30d2b83c8
          fetch-depth: 1
          persist-credentials: true
      - name: Verify and publish only the byte-pinned corrective tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=195b2e379b0644bd27581fd7452ddff30d2b83c8
          target=refs/heads/fix/post-merge-correctness-20260905
          test "$(git rev-parse HEAD)" = "$base"
          test "$(git rev-parse 'HEAD^{tree}')" = b95834d559ade04c882aa9500016e9a8ac4fc378
          current=$(git ls-remote origin refs/heads/main)
          test "$(printf '%s' "$current" | cut -f1)" = "$base"
          existing=$(git ls-remote origin "$target")
          test -z "$existing"
          evidence="$RUNNER_TEMP/corrective-evidence"
          mkdir -p "$evidence"
          for blob in 6234aca54b1a2b979fd6e9ab9a7017acdeb4551e 8f6ea4e7ccff71a570306a4ef7d3a0032a9c363f caa986079faa31187e406dcd279598a611a8b609; do
            gh api "repos/BoneManTGRM/SARA/git/blobs/$blob" --jq .content | base64 --decode >> "$evidence/corrective.patch.gz"
          done
          printf '%s  %s\n' 2ab34b7bca800501eb3881f08dae26727c461cf5580c437cd3e6ef718a9a9ca3 "$evidence/corrective.patch.gz" | sha256sum --check
          gzip -dc "$evidence/corrective.patch.gz" > "$evidence/corrective.patch"
          git apply --index "$evidence/corrective.patch"
          git diff --cached --check
          git diff --cached --name-only > "$evidence/changed-files.txt"
          cat > "$evidence/allowed-files.txt" <<'EOF'
          docs/POST_MERGE_CORRECTIVE_REVIEW.md
          docs/PR93_INTEGRATION.md
          proof/benchmark-run-admission.ts
          proof/guarded-repair-memory.ts
          proof/reparodynamic-learning-v5.ts
          proof/v7-live-evaluation.ts
          src/coding-repair-rejection.ts
          src/experimental-compiler-cache.ts
          src/experimental-v5/coding-repair-controller.ts
          src/experimental-v5/coding-repair-performance-gauge.ts
          src/experimental-v5/coding-repair-prompt.ts
          src/experimental-v5/coding-repair-verification.ts
          tests/coding-repair-rejection.test.ts
          tests/coding-repair-v5-cost-accounting.test.ts
          tests/coding-repair-v5-performance-gauge.test.ts
          tests/experimental-compiler-cache.test.ts
          tests/experimental-v5-admission.test.ts
          tests/experimental-v5-novelty.test.ts
          tests/post-merge-correctness.test.ts
          EOF
          diff -u "$evidence/allowed-files.txt" "$evidence/changed-files.txt"
          test "$(git write-tree)" = 0c7e579b83cf8ce5883286f0560b311b4a979953
          git -c user.name='SARA corrective integration' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix missed post-merge verification, accounting and compiler-cache defects'
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git rev-parse 'HEAD^{tree}')" = 0c7e579b83cf8ce5883286f0560b311b4a979953
          current=$(git ls-remote origin refs/heads/main)
          test "$(printf '%s' "$current" | cut -f1)" = "$base"
          existing=$(git ls-remote origin "$target")
          test -z "$existing"
          git push origin "HEAD:$target"
          git rev-parse HEAD > "$evidence/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$evidence/tree.txt"
          git archive HEAD | gzip -n > "$evidence/source.tar.gz"
          cd "$evidence"
          sha256sum corrective.patch.gz corrective.patch changed-files.txt allowed-files.txt commit.txt tree.txt source.tar.gz > SHA256SUMS
          cat commit.txt tree.txt
      - name: Preserve the exact published source and transfer checksums
        uses: actions/upload-artifact@v4
        with:
          name: sara-post-merge-corrective-source
          path: ${{ runner.temp }}/corrective-evidence/
          retention-days: 14
          if-no-files-found: error
