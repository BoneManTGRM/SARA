name: Verify exact native canary source
on:
  push:
    branches: [perf/native-verified-canary-20260906]
    paths: [.github/workflows/native-canary-source-transfer.yml]
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'BoneManTGRM/SARA' && github.actor == 'BoneManTGRM' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Recover only the exact captured sidecar package and lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sara-native-transfer
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/BoneManTGRM/SARA/actions/artifacts/9991092704/zip -o /tmp/sara-native-transfer/dependencies.zip
          python3 - <<'PY'
          import pathlib,hashlib,zipfile,tarfile,io
          data=pathlib.Path('/tmp/sara-native-transfer/dependencies.zip').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='59910b593a8ca6e79ff15b00589b4aed88c01cea9bb52d68cc4db0795aac9575'
          archive=zipfile.ZipFile(io.BytesIO(data))
          tar=tarfile.open(fileobj=io.BytesIO(archive.read('compiler.tar.gz')))
          target=pathlib.Path('tools/native-checker'); target.mkdir(parents=True)
          for name in ('package.json','package-lock.json'):
              item=tar.extractfile('compiler/'+name)
              assert item is not None
              (target/name).write_bytes(item.read())
          PY
          rm /tmp/sara-native-transfer/dependencies.zip
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix tools/native-checker --ignore-scripts --no-audit --no-fund
      - name: Reconstruct the tested source and binary-integrity manifest
        run: |
          set -euo pipefail
          git apply --index .sara-native-integration.patch
          python3 - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path('tools/native-checker'); files={}
          for name in ('node_modules/typescript','node_modules/@typescript/typescript-linux-x64'):
              for path in sorted((root/name).rglob('*')):
                  if path.is_file(): files[path.relative_to(root).as_posix()]=hashlib.sha256(path.read_bytes()).hexdigest()
          data=(json.dumps({'schemaVersion':1,'files':files},indent=2)+'\n').encode()
          assert hashlib.sha256(data).hexdigest()=='4429dc7b890f14428b3ffc8fc629c4c7c2bfe21a15121a4b97d1e583c1d4e7a2'
          (root/'integrity.json').write_bytes(data)
          PY
          git add tools/native-checker
          git rm .sara-native-integration.patch .github/workflows/native-canary-source-transfer.yml
          test -z "$(git ls-files '*node_modules*')"
          test "$(git write-tree)" = a0a5c6855fadff7d596adfff5548f461fc1caa9e
      - name: Full verification with no provider credentials
        run: |
          set -euo pipefail
          node --import tsx scripts/check-native-ready.ts | tee /tmp/sara-native-transfer/native-ready.json
          npm run verify | tee /tmp/sara-native-transfer/verify.log
          git diff --exit-code
          test "$(git write-tree)" = a0a5c6855fadff7d596adfff5548f461fc1caa9e
      - name: Publish only this exact verified branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = BoneManTGRM/SARA
          test "$GITHUB_REF" = refs/heads/perf/native-verified-canary-20260906
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'SARA verified source transfer'
          git config user.email 'source-transfer@users.noreply.github.com'
          git commit -m 'Use pinned native loop checks with mandatory fresh legacy acceptance'
          test "$(git rev-parse HEAD^{tree})" = a0a5c6855fadff7d596adfff5548f461fc1caa9e
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/perf/native-verified-canary-20260906
          unset AUTH GH_TOKEN
          git rev-parse HEAD > /tmp/sara-native-transfer/commit.txt
          git rev-parse HEAD^{tree} > /tmp/sara-native-transfer/tree.txt
          git archive --format=tar HEAD | gzip -n > /tmp/sara-native-transfer/source.tar.gz
          cd /tmp/sara-native-transfer
          sha256sum source.tar.gz verify.log native-ready.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sara-native-verified-source-${{ github.run_id }}
          path: /tmp/sara-native-transfer/
          if-no-files-found: error
          retention-days: 14
