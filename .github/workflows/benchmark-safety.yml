name: Benchmark safety exact-head proof
on:
  pull_request:
    branches: [experiment/reparodynamic-first-edits-v7]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/benchmark-rejection-replay-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts
      - run: npm run verify > verification.log 2>&1
      - run: npm run proof:http > http-repeat.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-safety-${{ github.event.pull_request.head.sha }}
          path: |
            verification.log
            http-repeat.log
  security:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/benchmark-rejection-replay-safety'
    name: Exact-head CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
