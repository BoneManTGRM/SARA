name: SARA compiler-reuse frontier verification
on:
  pull_request:
    branches: [experiment/v8-live-inventory-comparison]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/v9-compiler-reuse-frontier'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts
      - run: node --import tsx --test tests/experimental-compiler-cache.test.ts > compiler-tests.log 2>&1
      - run: npm run verify > verification.log 2>&1
      - name: Matched compiler and guarded-repair measurement
        env:
          SARA_RESEARCH_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --import tsx proof/compiler-cache-frontier.ts > compiler-frontier.log 2>&1
      - name: Preserve source and all partial evidence
        if: always()
        run: |
          git rev-parse HEAD > commit.txt
          git archive --format=tar.gz HEAD > source.tar.gz
          sha256sum source.tar.gz > source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sara-compiler-frontier-${{ github.event.pull_request.head.sha }}
          path: |
            compiler-tests.log
            verification.log
            compiler-frontier.log
            compiler-frontier-evidence
            commit.txt
            source.tar.gz
            source.sha256
          if-no-files-found: error
  security:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/v9-compiler-reuse-frontier'
    name: Exact-source CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
