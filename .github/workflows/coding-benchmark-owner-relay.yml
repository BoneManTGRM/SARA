name: Authorized post-fix SARA coding comparison
on:
  push:
    branches: [verify/coding-benchmark-owner-relay-20260905]
    paths: [.github/workflows/coding-benchmark-owner-relay.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: sara-postfix-88390661
  cancel-in-progress: false
jobs:
  compare-once:
    if: github.repository == 'BoneManTGRM/SARA' && github.actor == 'BoneManTGRM' && github.run_attempt == 1 && github.run_number == 6
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Launch once and retain terminal receipts
        env:
          EXPECTED_RUNTIME: 5009c6304a5aca2e7bef0d85caeadd1044965454
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo '4da241eafa0a0dabe8fd623bfb3f0456120ccbcb5da808619fd017bb4caa7d00  scripts/launch-post-fix-comparison.py' | sha256sum -c -
          python3 scripts/launch-post-fix-comparison.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sara-postfix-comparison-${{ github.run_id }}
          path: /tmp/sara-postfix-comparison-88390661
          if-no-files-found: error
          retention-days: 14
