name: Authorized SARA full-kernel coding comparison
on:
  push:
    branches: [verify/coding-benchmark-owner-relay-20260905]
    paths: [.github/workflows/coding-benchmark-owner-relay.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: sara-full-kernel-fc9b8552
  cancel-in-progress: false
jobs:
  compare-once:
    if: github.repository == 'BoneManTGRM/SARA' && github.actor == 'BoneManTGRM' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact unused full-kernel grant then one POST and GET-only recovery
        env:
          EXPECTED_RUNTIME: 89761c86fac88ef22d2406421ed60736da76b4f0
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo 'bb53e902bdc79662507e3ad91e19ace8709c6d968c081094f360c5c6e94fbaf7  scripts/launch-kernel-fc9b8552.py' | sha256sum -c -
          python3 scripts/launch-kernel-fc9b8552.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sara-full-kernel-live-${{ github.run_id }}
          path: /tmp/sara-kernel-fc9b8552
          retention-days: 14
          if-no-files-found: error
