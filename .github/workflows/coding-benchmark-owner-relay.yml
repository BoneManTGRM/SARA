name: Authorized maximum-observed SARA repair reuse pilot
on:
  push:
    branches: [verify/coding-benchmark-owner-relay-20260905]
    paths: [.github/workflows/coding-benchmark-owner-relay.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: sara-maximum-reuse-eb659a8f
  cancel-in-progress: false
jobs:
  compare-once:
    if: github.repository == 'BoneManTGRM/SARA' && github.actor == 'BoneManTGRM' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: One exact-scope launch then GET-only original evidence recovery
        env:
          EXPECTED_RUNTIME: d29d0bacaa423cd998d420e34826390ba313e077
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo 'e84185e39c5ae32a23814c827e0bde334299facf188c218da9446436c2ed389f  scripts/launch-max-reuse-eb659a8f.py' | sha256sum -c -
          python3 scripts/launch-max-reuse-eb659a8f.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sara-maximum-reuse-pilot-${{ github.run_id }}
          path: /tmp/sara-maximum-reuse-eb659a8f
          if-no-files-found: error
          retention-days: 14
