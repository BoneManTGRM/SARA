name: Authorized SARA full-kernel coding comparison
on:
  push:
    branches: [verify/coding-benchmark-owner-relay-20260905]
    paths: [.github/workflows/coding-benchmark-owner-relay.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: sara-full-kernel-17430b72
  cancel-in-progress: false
jobs:
  compare-once:
    if: github.repository == 'BoneManTGRM/SARA' && github.actor == 'BoneManTGRM' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact unused full-kernel grant then one POST and GET-only recovery
        env:
          EXPECTED_RUNTIME: dd5fac4a4c39617579830ab35dd49600999116d5
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo '384e3e74153b9510eb3d4ec9788642eb6f0f8aab8f81b3cf453a5f56334e1ec8  scripts/launch-kernel-17430b72.py' | sha256sum -c -
          python3 scripts/launch-kernel-17430b72.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sara-full-kernel-live-${{ github.run_id }}
          path: /tmp/sara-kernel-17430b72
          retention-days: 14
          if-no-files-found: error
