name: One-use authenticated coding speed trial
on:
  push:
    branches: [verify/coding-benchmark-owner-relay-20260905]
    paths:
      - .github/workflows/coding-benchmark-owner-relay.yml
permissions:
  contents: read
  id-token: write
jobs:
  launch-additional-matched-trial:
    if: github.repository == 'BoneManTGRM/SARA' && github.actor == 'BoneManTGRM' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Launch exactly one separately authorized matched trial
        env:
          EXPECTED_RUNTIME: 2c21426a52373cb2982e9759deb7e0f81f98df63
          PYTHONOPTIMIZE: '0'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sleep 55
          python3 scripts/launch-additional-coding-benchmark-relay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sara-additional-coding-benchmark-launch-${{ github.run_id }}
          path: /tmp/sara-relay-live-proof
          if-no-files-found: error
          retention-days: 7
