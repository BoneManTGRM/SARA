name: Verify exact full-kernel qualification source
on:
  push:
    branches: [feat/kernel-acceptance-live-17430b72]
    paths: [.github/workflows/kernel-source-transfer.yml]
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'BoneManTGRM/SARA' && github.actor == 'BoneManTGRM' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Reconstruct exact source; do not run a live qualification
        run: |
          set -euo pipefail
          mkdir -p /tmp/sara-kernel-source
          python3 - <<'PY'
          import base64,bz2,hashlib,pathlib
          encoded=''.join((pathlib.Path('.sara-kernel-transfer')/('part'+str(i))).read_text(encoding='ascii') for i in range(7))
          assert len(encoded)==37100
          patch=bz2.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==119817
          assert hashlib.sha256(patch).hexdigest()=='3db1bec926e9479adc9d72f7e97eab377c9ea3c69ba0ec3ce10e98abb1dbaa0c'
          pathlib.Path('/tmp/sara-kernel-source/candidate.patch').write_bytes(patch)
          PY
          git apply --index --unidiff-zero /tmp/sara-kernel-source/candidate.patch
          git rm -r .sara-kernel-transfer .github/workflows/kernel-source-transfer.yml
          test "$(git write-tree)" = 14be98837a7ae2512b0aa05e8d15929ebc611119
          test -z "$(git ls-files node_modules)"
      - run: npm ci --ignore-scripts
      - run: node scripts/build-native-checker.mjs
      - name: Full credential-free verification
        run: |
          set -euo pipefail
          npm run verify | tee /tmp/sara-kernel-source/verify.log
          git diff --exit-code
          test "$(git write-tree)" = 14be98837a7ae2512b0aa05e8d15929ebc611119
      - name: Publish only the verified isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = BoneManTGRM/SARA
          test "$GITHUB_REF" = refs/heads/feat/kernel-acceptance-live-17430b72
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'SARA verified source transfer'
          git config user.email 'source-transfer@users.noreply.github.com'
          git commit -m 'Harden kernel acceptance and register a full-kernel one-use comparison'
          test "$(git rev-parse HEAD^{tree})" = 14be98837a7ae2512b0aa05e8d15929ebc611119
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/kernel-acceptance-live-17430b72
          unset AUTH GH_TOKEN
          git rev-parse HEAD > /tmp/sara-kernel-source/commit.txt
          git rev-parse HEAD^{tree} > /tmp/sara-kernel-source/tree.txt
          git archive --format=tar HEAD | gzip -n > /tmp/sara-kernel-source/source.tar.gz
          cd /tmp/sara-kernel-source
          sha256sum candidate.patch source.tar.gz verify.log > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sara-full-kernel-source-${{ github.run_id }}
          path: /tmp/sara-kernel-source/
          if-no-files-found: error
          retention-days: 14
