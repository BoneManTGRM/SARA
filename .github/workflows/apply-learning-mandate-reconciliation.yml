name: Apply learning mandate reconciliation repair

on:
  push:
    branches:
      - fix/learning-mandate-reconciliation-20260911

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[mandate-reconcile-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact reconciliation repair
        run: |
          python3 <<'PY'
          from base64 import b64decode
          from pathlib import Path

          def s(value: str) -> str:
              return b64decode(value).decode()

          def exact_replace(path: str, old64: str, new64: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              old = s(old64)
              new = s(new64)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}")
              p.write_text(text.replace(old, new, expected))

          exact_replace('src/kernel.ts', 'ICByZXZva2VTdGFuZGluZ01hbmRhdGUocHJpbmNpcGFsOiBQcmluY2lwYWwsIG1hbmRhdGVJZDogc3RyaW5nLCByZWFzb246IHN0cmluZyk6IFByb21pc2U8U3RhbmRpbmdNYW5kYXRlPiB7', '')
          exact_replace('src/server.ts', '', '')
          exact_replace('src/server.ts', '', '')
          exact_replace('src/dashboard.ts', '', '')
          exact_replace('src/dashboard.ts', 'ICAgICAgICAgICsgJyBmcmVlIHJlcXVlc3RzLCB1cCB0byAxMCBwZXIgVVRDIGRheSBhbmQgZm91ciBhdHRlbXB0cyBwZXIgbGVhcm5pbmcgcm9vdC4gRnJvemVuIGNhcGFiaWxpdGllczogJyArIGNhbXBhaWduLmNvbnRyYWN0cy5tYXAoKGMpPT5jLmNhcGFiaWxpdHlJZCkuam9pbignLCAnKQ==', 'ICAgICAgICAgICsgJyBmcmVlIHJlcXVlc3RzLCB1cCB0byAyMCBwZXIgVVRDIGRheSBhbmQgZm91ciBhdHRlbXB0cyBwZXIgbGVhcm5pbmcgcm9vdC4gRnJvemVuIGNhcGFiaWxpdGllczogJyArIGNhbXBhaWduLmNvbnRyYWN0cy5tYXAoKGMpPT5jLmNhcGFiaWxpdHlJZCkuam9pbignLCAnKQ==')
          exact_replace('src/dashboard.ts', '', '')
          exact_replace('tests/model-budget.test.ts', '', '')
          exact_replace('tests/dashboard-script.test.ts', 'ICBmb3IoY29uc3Qgc2NyaXB0IG9mIHNjcmlwdHMpYXNzZXJ0LmRvZXNOb3RUaHJvdygoKT0+bmV3IFNjcmlwdChzY3JpcHRbMV0hLHtmaWxlbmFtZToic2VydmVkLWRhc2hib2FyZC5qcyJ9KSk7Cn0pOw==', '')
          PY
      - name: Build native checker
        run: node scripts/build-native-checker.mjs
      - name: Verify repository
        run: npm run verify
      - name: Commit verified source change
        run: |
          git config user.name "Reparodynamics"
          git config user.email "papadenico@yahoo.com"
          git add src/kernel.ts src/server.ts src/dashboard.ts tests/model-budget.test.ts tests/dashboard-script.test.ts
          git diff --cached --check
          git commit -m "Repair learning mandate reconciliation [mandate-reconcile-applied]"
          git push origin HEAD:fix/learning-mandate-reconciliation-20260911
