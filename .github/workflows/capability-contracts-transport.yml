name: Verify exact capability contracts
on:
  push:
    branches: [codex/sara-capability-contracts]
    paths: [.github/workflows/capability-contracts-transport.yml]
permissions:
  contents: write
concurrency:
  group: sara-capability-contracts-transport
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'BoneManTGRM/SARA' && github.ref == 'refs/heads/codex/sara-capability-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply exact reviewed source without retaining transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          baseline='d2b70329bbcae131fd702eaa227e16e1122f8728'
          changed=set(subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines())
          if changed != {'.github/workflows/capability-contracts-transport.yml'}:
              raise SystemExit('Unexpected source changes; reconcile before applying')
          encoded=(
          ''
          ''
          )
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          if len(patch)!=83584 or hashlib.sha256(patch).hexdigest()!='119ccfc214d457d4cdac355be5a3c4bfb56602eb704eb9d4021c023c0ecc473a':
              raise SystemExit('Patch integrity mismatch')
          pathlib.Path('/tmp/capability-contracts.patch').write_bytes(patch)
          PY
          git rm .github/workflows/capability-contracts-transport.yml
          git apply --check --index /tmp/capability-contracts.patch
          git apply --index /tmp/capability-contracts.patch
          test "$(git write-tree)" = 4a7fa49c28fd00aa32a9b7bfcd1c2ab9990046ac
          git diff --cached --check
      - name: Locked toolchain and focused qualification
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node scripts/build-native-checker.mjs
          node --import tsx --test tests/digital-capability-substrate.test.ts tests/digital-capability-boundaries.test.ts tests/digital-capability-runtime-proof.test.ts tests/digital-capability-receipt-integrity.test.ts tests/capability-control-projection.test.ts tests/learned-capability-control.test.ts tests/production-state-fingerprint.test.ts tests/state-backup-restore.test.ts tests/procedural-intelligence.test.ts | tee /tmp/capability-contracts-focused.tap
          npm run typecheck
      - name: Push only the exact verified product tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = 4a7fa49c28fd00aa32a9b7bfcd1c2ab9990046ac
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add authority-bound digital capability contracts, evidence and safe runtime proof'
          test "$(git ls-remote origin refs/heads/codex/sara-capability-contracts | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/sara-capability-contracts
          git rev-parse HEAD > /tmp/CAPABILITY_CONTRACTS_COMMIT.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: capability-contracts-verification
          path: |
            /tmp/capability-contracts-focused.tap
            /tmp/CAPABILITY_CONTRACTS_COMMIT.txt
          retention-days: 3
          if-no-files-found: error
