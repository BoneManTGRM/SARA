name: Verify exact kernel and provider integration
on:
  push:
    branches: [feat/kernel-acceptance-live-17430b72]
    paths: [.github/workflows/kernel-pr125-integration.yml]
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'BoneManTGRM/SARA' && github.actor == 'BoneManTGRM' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Reconstruct the exact reviewed integration without provider access
        run: |
          set -euo pipefail
          mkdir -p /tmp/kernel-pr125-integration
          python3 - <<'PY'
          import pathlib,base64,gzip,hashlib
          p0=pathlib.Path('.sara-kernel-integration/part0').read_bytes()
          p1=pathlib.Path('.sara-kernel-integration/part1').read_bytes()
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert blob(p0)=='3742605620a75aea8e60ab5ab00ec78844152893'
          assert blob(p1)=='838364761fd3e7e85a2d0ed9859d55a3a139e94e'
          # Correct the one proven transport transcription error, then enforce
          # the original patch digest and exact final source tree without bypass.
          assert p1.count(b'BrvqKBYrq')==1
          p1=p1.replace(b'BrvqKBYrq',b'BrvqBYrq')
          assert blob(p1)=='ad4a40f4ac5cb8fe5626cd79d1f54aab6094229a'
          encoded=p0+p1
          assert len(encoded)==13184
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==34306
          assert hashlib.sha256(patch).hexdigest()=='42bdee87aeaf8c0f715bc1af0a14a32430be54849ba23d2fdaca50592f870c36'
          pathlib.Path('/tmp/kernel-pr125-integration/candidate.patch').write_bytes(patch)
          PY
          git rm .github/workflows/kernel-pr125-integration.yml .sara-kernel-integration/part0 .sara-kernel-integration/part1
          test "$(git write-tree)" = 17a0956522efec7ac80763d50063b854b5042a33
          git apply --index /tmp/kernel-pr125-integration/candidate.patch
          test "$(git write-tree)" = 6f566f0e83c88ca6c114516963039f9a30ccb708
          test -z "$(git ls-files node_modules tools/native-checker/node_modules)"
      - run: npm ci --ignore-scripts
      - run: node scripts/build-native-checker.mjs
      - name: Full credential-free verification
        run: |
          set -euo pipefail
          npm run verify | tee /tmp/kernel-pr125-integration/verify.log
          git diff --exit-code
          test "$(git write-tree)" = 6f566f0e83c88ca6c114516963039f9a30ccb708
      - name: Archive verified source before attempting publication
        run: |
          set -euo pipefail
          git config user.name 'SARA verified source integration'
          git config user.email 'source-integration@users.noreply.github.com'
          git commit -m 'Integrate full-kernel qualification with existing provider hardening'
          test "$(git rev-parse HEAD^{tree})" = 6f566f0e83c88ca6c114516963039f9a30ccb708
          git rev-parse HEAD > /tmp/kernel-pr125-integration/commit.txt
          git rev-parse HEAD^{tree} > /tmp/kernel-pr125-integration/tree.txt
          git archive --format=tar HEAD | gzip -n > /tmp/kernel-pr125-integration/source.tar.gz
          cd /tmp/kernel-pr125-integration
          sha256sum candidate.patch source.tar.gz verify.log > SHA256SUMS
      - name: Publish only this verified feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = BoneManTGRM/SARA
          test "$GITHUB_REF" = refs/heads/feat/kernel-acceptance-live-17430b72
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/kernel-acceptance-live-17430b72
          unset AUTH GH_TOKEN
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sara-kernel-pr125-integration-${{ github.run_id }}
          path: /tmp/kernel-pr125-integration/
          retention-days: 14
          if-no-files-found: error
