name: Release PR59 after exact checks v2

on:
  push:
    branches:
      - automation/export-sara-pr59-20260904
    paths:
      - .github/workflows/release-pr59-after-exact-checks-v2.yml

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read

concurrency:
  group: release-pr59-after-exact-checks
  cancel-in-progress: false

jobs:
  exact-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: BoneManTGRM/SARA
      PR_NUMBER: "59"
    steps:
      - name: Lock an open stable PR head
        id: pr
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > pr.json
          test "$(jq -r .state pr.json)" = open
          test "$(jq -r .merged pr.json)" = false
          test "$(jq -r .base.ref pr.json)" = main
          head="$(jq -r .head.sha pr.json)"
          test "${#head}" -eq 40
          sleep 20
          test "$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$head"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Require completed exact-head pull-request checks
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 150); do
            gh api -H 'Accept: application/vnd.github+json' "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" > check-runs.json
            gh api "repos/$REPOSITORY/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" > workflow-runs.json
            checks="$(jq '.check_runs | length' check-runs.json)"
            workflows="$(jq '.workflow_runs | length' workflow-runs.json)"
            pending_checks="$(jq '[.check_runs[] | select(.status != "completed")] | length' check-runs.json)"
            pending_workflows="$(jq '[.workflow_runs[] | select(.status != "completed")] | length' workflow-runs.json)"
            if [ "$checks" -gt 0 ] && [ "$workflows" -gt 0 ] && [ "$pending_checks" -eq 0 ] && [ "$pending_workflows" -eq 0 ]; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true

          jq '[.check_runs | sort_by(.started_at // .created_at) | group_by(.name)[] | last]' check-runs.json > latest-checks.json
          jq '[.workflow_runs | sort_by(.run_started_at // .created_at) | group_by(.name)[] | last]' workflow-runs.json > latest-workflows.json

          jq -e '[.[] | select((.name | ascii_downcase | test("codeql|code scanning|analy[sz]e")) and .conclusion == "success")] | length > 0' latest-checks.json
          jq -e '[.[] | select((.name | ascii_downcase | test("(^|[^a-z])(ci|test|verify|build)([^a-z]|$)")) and .conclusion == "success")] | length > 0' latest-checks.json
          jq -e '[.[] | select((.name | ascii_downcase | test("codeql|code scanning")) and .conclusion == "success")] | length > 0' latest-workflows.json
          jq -e '[.[] | select((.name | ascii_downcase | test("(^|[^a-z])ci([^a-z]|$)|test|verify")) and .conclusion == "success")] | length > 0' latest-workflows.json
          jq -e '[.[] | select((.name | ascii_downcase | test("codeql|code scanning|analy[sz]e|(^|[^a-z])(ci|test|verify|build)([^a-z]|$)")) and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length == 0' latest-checks.json
          jq -e '[.[] | select((.name | ascii_downcase | test("codeql|code scanning|(^|[^a-z])ci([^a-z]|$)|test|verify")) and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length == 0' latest-workflows.json

      - name: Check out exact checked head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run fresh full repository verification
        run: |
          set -o pipefail
          npm ci
          npm run verify 2>&1 | tee exact-head-verify.log

      - name: Inspect the exact release diff
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --check origin/main...HEAD
          unexpected="$(git diff --name-only origin/main...HEAD | awk '!/^(src|tests|docs)\// { count += 1 } END { print count + 0 }')"
          test "$unexpected" -eq 0
          ! git grep -n 'beardedwarrior5161@gmail.com' HEAD -- src tests docs
          ! git grep -n -E '(gmail|google).*(password|app password)' HEAD -- src docs
          ! git grep -n -E 'console\.(log|error|warn).*(refreshToken|clientSecret|authorization)' HEAD -- 'src/gmail-*.ts' 'src/telegram-nico-*.ts'
          git grep -n 'sara.reparodynamics@gmail.com' HEAD -- src docs >/dev/null
          git grep -n 'reparodynamics@gmail.com' HEAD -- src docs >/dev/null
          test "$(git grep -n 'handleTelegramNicoProductionRequest({' HEAD -- src/server.ts | wc -l)" -eq 1
          test "$(git diff --name-only origin/main...HEAD | wc -l)" -le 30

      - name: Reconfirm immutable head and successful checks
        env:
          LOCKED_HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$LOCKED_HEAD"
          gh api -H 'Accept: application/vnd.github+json' "repos/$REPOSITORY/commits/$LOCKED_HEAD/check-runs?per_page=100" > final-check-runs.json
          jq -e '[.check_runs[] | select(.status != "completed")] | length == 0' final-check-runs.json

      - name: Mark the verified PR ready and bind its evidence
        env:
          LOCKED_HEAD: ${{ steps.pr.outputs.head }}
        run: |
          cat > pr-body.md <<EOF
          ## Purpose

          Add a separate authenticated, deterministic Telegram action bridge for exact-commit NICO automated assessments and independently verified report delivery from SARA's designated Gmail identity.

          ## Trust boundaries

          - Existing Telegram Luna remains analysis-only.
          - Only Cody's paired Telegram identity plus the existing bridge credential may submit the five supported schemas.
          - Commands are durable and replay-safe; one immutable NICO run identity is reused after restart.
          - Targets require one canonical public GitHub repository URL and a lowercase 40-character commit SHA.
          - Automated delivery requires a terminal exact-target NICO record, zero unresolved review workload, exact artifact schema/hash/size identity, independent package verification, and an explicit no-human-review disclosure.
          - Gmail is fixed to `sara.reparodynamics@gmail.com` -> `reparodynamics@gmail.com`; sender identity is freshly checked immediately before send.
          - OAuth uses PKCE, single-use state, OpenID email identity plus `gmail.send`, exact-account refusal, and protected Railway-secret installation.
          - Emergency stop, owner revocation, exact mandate, daily limit, concurrency one, cost ceiling, and provider-acceptance truth remain fail-closed.

          ## Exact-head verification

          Locked head: `$LOCKED_HEAD`

          - Normal pull-request CI: success on this exact head.
          - CodeQL/code scanning: success on this exact head.
          - `npm run verify`: passed again in this release gate.
          - Final diff, credential, identity, and unsupported-claim review: passed.
          - CI performed no live assessment, OAuth consent, or email delivery.

          ## Activation state

          Production Gmail remains disabled until Cody completes Google consent for exactly `sara.reparodynamics@gmail.com`. The private p-map assessment and email remain gated until exact deployment, paired-identity production verification, fresh Gmail identity verification, and terminal NICO evidence all succeed.
          EOF
          gh pr edit "$PR_NUMBER" --body-file pr-body.md
          gh pr ready "$PR_NUMBER"

      - name: Merge only the locked verified head
        id: merge
        env:
          LOCKED_HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f sha="$LOCKED_HEAD" \
            -f merge_method=merge \
            -f commit_title='Add bounded Telegram NICO assessment and verified Gmail delivery (#59)' \
            -f commit_message='Exact-head CI, CodeQL, full repository verification, and trust-boundary review passed before merge.' \
            > merge.json
          jq -e '.merged == true' merge.json
          merged_sha="$(jq -r .sha merge.json)"
          test "${#merged_sha}" -eq 40
          echo "merged_sha=$merged_sha" >> "$GITHUB_OUTPUT"

      - name: Record and comment non-secret release evidence
        env:
          LOCKED_HEAD: ${{ steps.pr.outputs.head }}
          MERGED_SHA: ${{ steps.merge.outputs.merged_sha }}
        run: |
          jq -n \
            --argjson pullRequest 59 \
            --arg verifiedHead "$LOCKED_HEAD" \
            --arg mergedCommit "$MERGED_SHA" \
            '{pullRequest:$pullRequest, verifiedHead:$verifiedHead, mergedCommit:$mergedCommit, ci:"success", codeql:"success", fullVerify:"success", liveAssessmentExecuted:false, emailSent:false}' \
            > pr59-release-evidence-v2.json
          gh pr comment "$PR_NUMBER" --body "Merged exact verified head \`$LOCKED_HEAD\` as \`$MERGED_SHA\`. Gmail activation, the private p-map run, and email delivery remain blocked pending production deployment and exact-account OAuth."

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr59-release-evidence-v2
          path: |
            pr.json
            check-runs.json
            workflow-runs.json
            latest-checks.json
            latest-workflows.json
            final-check-runs.json
            exact-head-verify.log
            merge.json
            pr59-release-evidence-v2.json
          if-no-files-found: error
          retention-days: 14
