name: Publish reviewed benchmark readiness patch once
on:
  push:
    branches: [fix/coding-benchmark-readiness-20260905]
    paths: [.github/workflows/benchmark-readiness-publish.yml]
permissions:
  contents: write
concurrency:
  group: sara-readiness-publish-20260905
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'BoneManTGRM/SARA' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode hash-bound locally reviewed patch
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = f240fe5f99bd7ab2583906986ef8e6730b17e879
          mkdir -p /tmp/readiness-evidence
          python3 - <<'PY'
          import base64, lzma, hashlib, pathlib
          encoded = (
          ''
          ''
          ''
          )
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '44a64e8320170346f3c7163939b114f03ee36cc458c5c387b862d5fbd39393dd'
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == 'af39b1b0cdb2a93f4f406543b09f0629462c8cce62aaa334cde285af64829c73'
          pathlib.Path('/tmp/readiness-evidence/readiness.patch').write_bytes(patch)
          PY
          git apply --index /tmp/readiness-evidence/readiness.patch
          git rm .github/workflows/benchmark-readiness-capture.yml .github/workflows/benchmark-readiness-publish.yml
          test "$(git write-tree)" = e72b81b3700f2881a3a71b7f37e31e880d9520ad
          git write-tree > /tmp/readiness-evidence/verified-tree.txt
          git diff --cached --check
          git archive --format=tar.gz e72b81b3700f2881a3a71b7f37e31e880d9520ad > /tmp/readiness-evidence/reviewed-source.tar.gz
      - name: Full frozen-tree offline verification
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify 2>&1 | tee /tmp/readiness-evidence/verify.log
      - name: Publish source only to the existing isolated branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep transport workflows unchanged for this token's push. The connected
          # GitHub tool removes them before the PR, restoring the verified tree.
          git restore --source="$GITHUB_SHA" --staged --worktree .github/workflows/benchmark-readiness-capture.yml .github/workflows/benchmark-readiness-publish.yml
          git config user.name 'SARA readiness verification'
          git config user.email 'noreply@users.noreply.github.com'
          git commit -m 'Harden existing coding benchmark admission and private execution evidence'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          test "$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" ls-remote origin refs/heads/fix/coding-benchmark-readiness-20260905 | cut -f1)" = "$GITHUB_SHA"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/coding-benchmark-readiness-20260905
          git rev-parse HEAD > /tmp/readiness-evidence/published-transport-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sara-readiness-reviewed-candidate
          path: /tmp/readiness-evidence
          if-no-files-found: error
          retention-days: 14
