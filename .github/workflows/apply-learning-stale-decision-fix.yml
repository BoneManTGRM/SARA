name: Apply stale learning decision fix

on:
  push:
    branches:
      - fix/learning-stale-decision-replay-20260911

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/apply-stale-learning-decision-fix.py
      - run: node scripts/build-native-checker.mjs
      - run: npm run verify
      - name: Commit verified source change
        run: |
          git config user.name "Reparodynamics"
          git config user.email "papadenico@yahoo.com"
          git add src/kernel.ts tests/autonomous-learning.test.ts
          git diff --cached --check
          git commit -m "Repair stale learning decision replay [stale-learning-decision-fixed]"
          git push origin HEAD:fix/learning-stale-decision-replay-20260911
