name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node scripts/build-native-checker.mjs
      - run: npm run verify
      - name: Qualify actual sandboxed browser
        run: node --import tsx src/digital-capabilities/web/browser-qualification.ts
