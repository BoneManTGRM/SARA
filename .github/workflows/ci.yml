name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node scripts/build-native-checker.mjs
      - name: Qualify actual sandboxed browser
        run: node --import tsx src/digital-capabilities/web/browser-qualification.ts
      - name: Qualify actual owner conversation on desktop and mobile
        run: node --import tsx scripts/qualify-owner-conversation-ui.ts
      - name: Preserve isolated owner runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-software-runtime-evidence
          path: |
            artifacts/owner-software-runtime-qualification.json
            artifacts/owner-software-runtime-*.png
          if-no-files-found: ignore
      - run: npm run verify
