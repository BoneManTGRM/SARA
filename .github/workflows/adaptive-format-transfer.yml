name: Verify adaptive repair format candidate
on:
  push:
    branches: [perf/adaptive-repair-format-20260906]
    paths: [.github/workflows/adaptive-format-transfer.yml]
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'BoneManTGRM/SARA' && github.actor == 'BoneManTGRM' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Apply digest-bound candidate
        env:
          PATCH_BASE64: 
        run: |
          set -euo pipefail
          mkdir -p /tmp/sara-adaptive-transfer
          python3 - <<'PY'
          import os,base64,gzip,hashlib,pathlib
          patch=gzip.decompress(base64.b64decode(os.environ['PATCH_BASE64'],validate=True))
          assert len(patch)==36681
          assert hashlib.sha256(patch).hexdigest()=='894a78ccbd8119c51586a3e40669426b4b4823695034a753fc25c85abd5211a2'
          pathlib.Path('/tmp/sara-adaptive-transfer/candidate.patch').write_bytes(patch)
          PY
          git apply --index /tmp/sara-adaptive-transfer/candidate.patch
          git rm .github/workflows/adaptive-format-transfer.yml
          test "$(git write-tree)" = aa64df8341183b95530a9289be206fc759083aa0
          test -z "$(git ls-files node_modules)"
      - run: npm ci --ignore-scripts
      - name: Verify without provider credentials
        run: |
          set -euo pipefail
          npm run verify | tee /tmp/sara-adaptive-transfer/verify.log
          git diff --exit-code
          test "$(git write-tree)" = aa64df8341183b95530a9289be206fc759083aa0
      - name: Publish verified candidate on this branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/perf/adaptive-repair-format-20260906
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'SARA verified source transfer'
          git config user.email 'source-transfer@users.noreply.github.com'
          git commit -m 'Select digest-bound compact edits for large canary repairs'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/perf/adaptive-repair-format-20260906
          unset AUTH GH_TOKEN
          git rev-parse HEAD > /tmp/sara-adaptive-transfer/commit.txt
          git rev-parse HEAD^{tree} > /tmp/sara-adaptive-transfer/tree.txt
          git archive --format=tar HEAD | gzip -n > /tmp/sara-adaptive-transfer/source.tar.gz
          cd /tmp/sara-adaptive-transfer
          sha256sum candidate.patch source.tar.gz verify.log > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sara-adaptive-format-transfer-${{ github.run_id }}
          path: /tmp/sara-adaptive-transfer/
          if-no-files-found: error
          retention-days: 14
