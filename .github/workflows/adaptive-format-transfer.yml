name: Verify combined adaptive repair candidate
on:
  push:
    branches: [perf/adaptive-repair-format-20260906]
    paths: [.github/workflows/adaptive-format-transfer.yml]
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'BoneManTGRM/SARA' && github.actor == 'BoneManTGRM' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Preserve fresh hosts while integrating compact output
        run: |
          set -euo pipefail
          mkdir -p /tmp/sara-adaptive-transfer
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/server.ts')
          value=p.read_text()
          assert 'experimentalCompilerCache: codingTypecheckHost(options.reparodynamicCoding!.mode)' in value
          old='import { createLunaCodingRepairModel } from "./luna-coding-repair-model.ts";'
          new=old+'\nimport { createAdaptiveCodingRepairModel, persistRepairFormatDecision } from "./adaptive-coding-repair-model.ts";'
          assert value.count(old)==1
          value=value.replace(old,new)
          old='''      model: (context) => createLunaCodingRepairModel({
                  client: options.reparodynamicCoding!.modelClient,
                  context,
                }),'''
          new='''      model: (context) => options.reparodynamicCoding!.mode === "canary"
                  ? createAdaptiveCodingRepairModel({ client: options.reparodynamicCoding!.modelClient, context,
                    onFormat: (decision) => persistRepairFormatDecision({
                      stateDirectory: options.reparodynamicCoding!.stateDirectory, runId, decision }),
                  })
                  : createLunaCodingRepairModel({ client: options.reparodynamicCoding!.modelClient, context }),'''
          assert value.count(old)==1
          p.write_text(value.replace(old,new))
          p=Path('src/coding-repair-memory.ts')
          value=p.read_text()
          assert '"fresh-typecheck-host.ts", "experimental-compiler-cache.ts"' in value
          old='"luna-coding-repair-model.ts", "reparodynamic-candidate-generator.ts"'
          new='"luna-coding-repair-model.ts", "adaptive-coding-repair-model.ts", "coding-repair-edits.ts", "model-router.ts", "reparodynamic-candidate-generator.ts"'
          assert value.count(old)==1
          p.write_text(value.replace(old,new))
          PY
          git add src/server.ts src/coding-repair-memory.ts
          git rm .github/workflows/adaptive-format-transfer.yml
          test "$(git write-tree)" = 3e01f3854ee667742b8f2b507c52de43d5b9b6f1
          test -z "$(git ls-files node_modules)"
      - run: npm ci --ignore-scripts
      - name: Verify exact combined source without provider credentials
        run: |
          set -euo pipefail
          npm run verify | tee /tmp/sara-adaptive-transfer/verify.log
          git diff --exit-code
          test "$(git write-tree)" = 3e01f3854ee667742b8f2b507c52de43d5b9b6f1
      - name: Publish only this verified branch candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = BoneManTGRM/SARA
          test "$GITHUB_REF" = refs/heads/perf/adaptive-repair-format-20260906
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'SARA verified source transfer'
          git config user.email 'source-transfer@users.noreply.github.com'
          git commit -m 'Integrate adaptive repair output with unchanged fresh typechecking hosts'
          test "$(git rev-parse HEAD^{tree})" = 3e01f3854ee667742b8f2b507c52de43d5b9b6f1
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/perf/adaptive-repair-format-20260906
          unset AUTH GH_TOKEN
          git rev-parse HEAD > /tmp/sara-adaptive-transfer/commit.txt
          git rev-parse HEAD^{tree} > /tmp/sara-adaptive-transfer/tree.txt
          git archive --format=tar HEAD | gzip -n > /tmp/sara-adaptive-transfer/source.tar.gz
          cd /tmp/sara-adaptive-transfer
          sha256sum source.tar.gz verify.log > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sara-adaptive-format-transfer-${{ github.run_id }}
          path: /tmp/sara-adaptive-transfer/
          if-no-files-found: error
          retention-days: 14
