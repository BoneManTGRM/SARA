name: Apply PR59 Telegram NICO integration

on:
  push:
    branches:
      - automation/export-sara-pr59-20260904
    paths:
      - .github/workflows/apply-pr59-telegram-nico-integration.yml

permissions:
  contents: write

concurrency:
  group: apply-pr59-telegram-nico-integration
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/telegram-nico-gmail-delivery
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Patch the existing backend and restart-safe retry semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          server = Path('src/server.ts')
          text = server.read_text()
          import_line = 'import { handleTelegramNicoProductionRequest } from "./telegram-nico-production.ts";\n'
          if import_line not in text:
              lines = text.splitlines(True)
              last_import = max(i for i, line in enumerate(lines) if line.startswith('import '))
              lines.insert(last_import + 1, import_line)
              text = ''.join(lines)

          if 'handleTelegramNicoProductionRequest({' not in text:
              anchor = text.rfind('createServer(')
              if anchor < 0:
                  raise SystemExit('createServer anchor not found')
              callback = re.search(r'(?:async\s*)?\(\s*([A-Za-z_$][\w$]*)\s*,\s*([A-Za-z_$][\w$]*)\s*\)\s*=>', text[anchor:])
              if not callback:
                  raise SystemExit('HTTP callback parameters not found')
              request_name, response_name = callback.group(1), callback.group(2)
              url_match = re.search(r'(?m)^(\s*)const\s+url\s*=\s*new\s+URL\(', text[anchor:])
              if not url_match:
                  raise SystemExit('request URL initialization not found')
              absolute = anchor + url_match.start()
              semicolon = text.find(';', absolute)
              if semicolon < 0:
                  raise SystemExit('request URL statement terminator not found')
              indent = url_match.group(1)
              insertion = (
                  f'\n{indent}if (await handleTelegramNicoProductionRequest({{\n'
                  f'{indent}  request: {request_name},\n'
                  f'{indent}  response: {response_name},\n'
                  f'{indent}  url,\n'
                  f'{indent}  kernel,\n'
                  f'{indent}  options,\n'
                  f'{indent}}})) return;'
              )
              text = text[:semicolon + 1] + insertion + text[semicolon + 1:]
          server.write_text(text)

          operator = Path('src/telegram-nico-delivery.ts')
          value = operator.read_text()
          value = value.replace(
              '      if (existing.status === "failed" && existing.failure) throw new Error(existing.failure.reason);\n',
              '      // A blocked or interrupted command may resume with the same immutable request and run identity.\n'
          )
          old = '    humanReviewed: firstValue(source, new Set(["humanreviewed"])) === true,\n'
          if old in value:
              value = value.replace(
                  '  const identity = artifactIdentity(source) ?? run.artifactIdentity;\n  if (!identity) throw new Error("NICO did not return an exact artifact schema plus hash-and-size identity.");\n  return {\n',
                  '  const identity = artifactIdentity(source) ?? run.artifactIdentity;\n  if (!identity) throw new Error("NICO did not return an exact artifact schema plus hash-and-size identity.");\n  const humanReviewed = firstValue(source, new Set(["humanreviewed"]));\n  if (humanReviewed !== false) throw new Error("The automated NICO package must explicitly state that it was not human reviewed.");\n  return {\n'
              )
              value = value.replace(old, '    humanReviewed: false,\n')
          operator.write_text(value)
          PY

      - name: Install exact dependencies
        run: npm ci

      - name: Focused trust-boundary tests
        run: >-
          node --import tsx --test
          tests/telegram-nico-delivery.test.ts
          tests/telegram-nico-delivery-workflow.test.ts
          tests/telegram-nico-http.test.ts
          tests/telegram-nico-production.test.ts
          tests/github-exact-target-verifier.test.ts
          tests/nico-automated-package-verifier.test.ts
          tests/gmail-oauth-activation.test.ts
          tests/gmail-verified-report-sender.test.ts

      - name: Strict typecheck
        run: npm run typecheck

      - name: Full repository verification
        run: npm run verify

      - name: Sensitive-output and scope review
        run: |
          set -euo pipefail
          ! grep -RIn --exclude-dir=node_modules --exclude='*.test.ts' 'beardedwarrior5161@gmail.com' src docs proof scripts
          ! grep -RIn --exclude-dir=node_modules --exclude='*.test.ts' -E '(gmail|google).*(password|app password)' src docs proof scripts
          ! grep -RIn --exclude-dir=node_modules -E 'console\.(log|error|warn).*?(refreshToken|clientSecret|authorization)' src/gmail-*.ts src/telegram-nico-*.ts
          git diff --check

      - name: Commit verified integration to PR #59
        run: |
          git config user.name "Reparodynamics"
          git config user.email "papadenico@yahoo.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No additional integration patch was required."
            exit 0
          fi
          git commit -m "Complete bounded Telegram NICO and Gmail integration"
          git push origin HEAD:feature/telegram-nico-gmail-delivery
