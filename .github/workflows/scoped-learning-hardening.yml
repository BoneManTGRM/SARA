name: Scoped learning hardening
on:
  push:
    branches: [codex/learning-acceleration-20260910]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/learning-acceleration-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply hardening
        run: |
          python3 scripts/apply-learning-hardening.py
          sed -i '/let transportRetriesUsed = reservation.transportRetriesUsed;/d' src/kernel.ts
      - run: npm ci
      - name: Verify targeted and complete repository
        run: |
          node --import tsx --test tests/learning-acceleration.test.ts tests/learning-acceleration-regression.test.ts
          npm run typecheck
          npm run verify
          git diff --check
      - name: Commit verified hardening
        run: |
          rm scripts/apply-learning-hardening.py
          rm .github/workflows/scoped-learning-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make learning recovery restart safe"
          git push origin HEAD:codex/learning-acceleration-20260910
