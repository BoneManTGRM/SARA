name: Finalize PR59 statefully

on:
  push:
    branches:
      - automation/export-sara-pr59-20260904
    paths:
      - .github/workflows/finalize-pr59-statefully.yml

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read

concurrency:
  group: release-pr59-after-exact-checks
  cancel-in-progress: false

jobs:
  verify-or-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: BoneManTGRM/SARA
      PR_NUMBER: "59"
    steps:
      - name: Resolve immutable target state
        id: target
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > pr.json
          merged="$(jq -r .merged pr.json)"
          if [ "$merged" = true ]; then
            sha="$(jq -r .merge_commit_sha pr.json)"
            mode=verify_merged
          else
            test "$(jq -r .state pr.json)" = open
            sha="$(jq -r .head.sha pr.json)"
            mode=verify_and_merge
          fi
          test "${#sha}" -eq 40
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Require exact-head normal CI and CodeQL when still open
        if: steps.target.outputs.mode == 'verify_and_merge'
        env:
          HEAD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          settled=false
          for attempt in $(seq 1 150); do
            gh api -H 'Accept: application/vnd.github+json' "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" > check-runs.json
            count="$(jq '.check_runs | length' check-runs.json)"
            pending="$(jq '[.check_runs[] | select(.status != "completed")] | length' check-runs.json)"
            if [ "$count" -gt 0 ] && [ "$pending" -eq 0 ]; then
              settled=true
              break
            fi
            sleep 10
          done
          test "$settled" = true
          jq '[.check_runs | sort_by(.started_at // .created_at) | group_by(.name)[] | last]' check-runs.json > latest-checks.json
          jq -e '[.[] | select((.name | ascii_downcase | test("codeql|code scanning|analy[sz]e")) and .conclusion == "success")] | length > 0' latest-checks.json
          jq -e '[.[] | select((.name | ascii_downcase | test("ci|test|verify|build")) and .conclusion == "success")] | length > 0' latest-checks.json
          jq -e '[.[] | select((.name | ascii_downcase | test("codeql|code scanning|analy[sz]e|ci|test|verify|build")) and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length == 0' latest-checks.json

      - name: Check out exact open head or merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify required implementation is present
        run: |
          set -euo pipefail
          for path in \
            src/github-exact-target-verifier.ts \
            src/gmail-oauth-activation.ts \
            src/gmail-verified-report-sender.ts \
            src/nico-automated-package-verifier.ts \
            src/telegram-nico-delivery.ts \
            src/telegram-nico-http.ts \
            src/telegram-nico-production.ts \
            tests/telegram-nico-delivery-workflow.test.ts \
            tests/telegram-nico-http.test.ts \
            tests/gmail-oauth-activation.test.ts \
            tests/gmail-verified-report-sender.test.ts; do
            test -f "$path"
          done
          test "$(git grep -n 'handleTelegramNicoProductionRequest({' HEAD -- src/server.ts | wc -l)" -eq 1

      - name: Fresh full repository verification
        run: |
          set -o pipefail
          npm ci
          npm run verify 2>&1 | tee final-exact-verify.log

      - name: Final secret, identity, and scope inspection
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --check
          ! git grep -n 'beardedwarrior5161@gmail.com' HEAD -- src tests docs
          ! git grep -n -E '(gmail|google).*(password|app password)' HEAD -- src docs
          ! git grep -n -E 'console\.(log|error|warn).*(refreshToken|clientSecret|authorization)' HEAD -- 'src/gmail-*.ts' 'src/telegram-nico-*.ts'
          git grep -n 'sara.reparodynamics@gmail.com' HEAD -- src docs >/dev/null
          git grep -n 'reparodynamics@gmail.com' HEAD -- src docs >/dev/null
          if [ "${{ steps.target.outputs.mode }}" = verify_and_merge ]; then
            unexpected="$(git diff --name-only origin/main...HEAD | awk '!/^(src|tests|docs)\// { count += 1 } END { print count + 0 }')"
            test "$unexpected" -eq 0
            test "$(git diff --name-only origin/main...HEAD | wc -l)" -le 30
          fi

      - name: Reconfirm unchanged open head
        if: steps.target.outputs.mode == 'verify_and_merge'
        env:
          LOCKED_HEAD: ${{ steps.target.outputs.sha }}
        run: test "$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$LOCKED_HEAD"

      - name: Mark ready and merge exact verified head
        if: steps.target.outputs.mode == 'verify_and_merge'
        id: merge
        env:
          LOCKED_HEAD: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          gh pr ready "$PR_NUMBER"
          gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f sha="$LOCKED_HEAD" \
            -f merge_method=merge \
            -f commit_title='Add bounded Telegram NICO assessment and verified Gmail delivery (#59)' \
            -f commit_message='Merged only after exact-head CI, CodeQL, full verification, and final trust-boundary inspection.' \
            > merge.json
          jq -e '.merged == true' merge.json
          merged_sha="$(jq -r .sha merge.json)"
          test "${#merged_sha}" -eq 40
          echo "merged_sha=$merged_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve final merged commit
        id: final
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > final-pr.json
          test "$(jq -r .merged final-pr.json)" = true
          merged_sha="$(jq -r .merge_commit_sha final-pr.json)"
          test "${#merged_sha}" -eq 40
          echo "merged_sha=$merged_sha" >> "$GITHUB_OUTPUT"

      - name: Write non-secret finalization evidence
        env:
          VERIFIED_SHA: ${{ steps.target.outputs.sha }}
          MERGED_SHA: ${{ steps.final.outputs.merged_sha }}
          MODE: ${{ steps.target.outputs.mode }}
        run: |
          jq -n \
            --argjson pullRequest 59 \
            --arg mode "$MODE" \
            --arg verifiedCommit "$VERIFIED_SHA" \
            --arg mergedCommit "$MERGED_SHA" \
            '{pullRequest:$pullRequest, mode:$mode, verifiedCommit:$verifiedCommit, mergedCommit:$mergedCommit, fullVerify:"success", assessmentExecuted:false, emailSent:false}' \
            > pr59-finalization-evidence.json
          gh pr comment "$PR_NUMBER" --body "Final exact-tree verification passed for \`$VERIFIED_SHA\`. PR #59 is merged as \`$MERGED_SHA\`. Gmail OAuth, the p-map assessment, and report email remain inactive pending production gates."

      - name: Upload finalization evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr59-finalization-evidence
          path: |
            pr.json
            check-runs.json
            latest-checks.json
            final-exact-verify.log
            merge.json
            final-pr.json
            pr59-finalization-evidence.json
          if-no-files-found: warn
          retention-days: 14
