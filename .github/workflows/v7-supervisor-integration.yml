name: V7 supervisor integration checks
on:
  pull_request:
    branches: [experiment/benchmark-rejection-replay-safety]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/v7-supervisor-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts
      - name: Focused supervisor safety tests
        run: node --import tsx --test tests/benchmark-run-admission.test.ts tests/benchmark-run-supervisor.test.ts
      - name: Full verification
        run: npm run verify
      - name: Repeated HTTP proof
        run: npm run proof:http
  security:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/v7-supervisor-integration'
    name: Exact-head CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
