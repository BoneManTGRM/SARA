name: Verify exact memory projection and fresh pilot source
on:
  push:
    branches: [fix/memory-projection-live-d89f2a9c]
    paths: [.github/workflows/memory-projection-transfer.yml]
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'BoneManTGRM/SARA' && github.actor == 'BoneManTGRM' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Apply exact readable integration and remove transport
        run: |
          set -euo pipefail
          mkdir -p /tmp/sara-projection-transfer
          echo '89adef5304faa5fd8cf2e16f0f99c54718ef2454d5590be3cd806638155b7c39  .sara-integration.patch' | sha256sum -c -
          git apply --index .sara-integration.patch
          git rm .sara-integration.patch .github/workflows/memory-projection-transfer.yml
          test "$(git write-tree)" = 8cacc8a86c28e88d7a59aa81ad84dbb4eb9e37c1
          test -z "$(git ls-files node_modules)"
      - run: npm ci --ignore-scripts
      - run: node scripts/build-native-checker.mjs
      - name: Full verification without provider credentials
        run: |
          set -euo pipefail
          npm run verify | tee /tmp/sara-projection-transfer/verify.log
          git diff --exit-code
          test "$(git write-tree)" = 8cacc8a86c28e88d7a59aa81ad84dbb4eb9e37c1
      - name: Publish only the verified branch candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = BoneManTGRM/SARA
          test "$GITHUB_REF" = refs/heads/fix/memory-projection-live-d89f2a9c
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'SARA verified source transfer'
          git config user.email 'source-transfer@users.noreply.github.com'
          git commit -m 'Harden UTF8 repair storage and select immutable memory projections'
          test "$(git rev-parse HEAD^{tree})" = 8cacc8a86c28e88d7a59aa81ad84dbb4eb9e37c1
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/memory-projection-live-d89f2a9c
          unset AUTH GH_TOKEN
          git rev-parse HEAD > /tmp/sara-projection-transfer/commit.txt
          git rev-parse HEAD^{tree} > /tmp/sara-projection-transfer/tree.txt
          git archive --format=tar HEAD | gzip -n > /tmp/sara-projection-transfer/source.tar.gz
          cd /tmp/sara-projection-transfer
          sha256sum source.tar.gz verify.log > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sara-projection-source-${{ github.run_id }}
          path: /tmp/sara-projection-transfer/
          retention-days: 14
          if-no-files-found: error
