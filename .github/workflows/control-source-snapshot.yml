name: Control substrate source snapshot
on:
  push:
    branches: [codex/sara-control-substrate]
    paths: [.github/workflows/control-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 81e074afd797e5ba698d6bac302b70c600d31a00
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Export tracked baseline and locked development dependencies
        run: |
          npm ci --ignore-scripts
          git archive --format=tar HEAD | gzip > baseline-source.tar.gz
          tar -czf baseline-dependencies.tar.gz node_modules
          git rev-parse HEAD > BASELINE_SHA.txt
          sha256sum baseline-source.tar.gz baseline-dependencies.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-baseline-81e074afd797
          path: |
            baseline-source.tar.gz
            baseline-dependencies.tar.gz
            BASELINE_SHA.txt
            SHA256SUMS
          retention-days: 3
          if-no-files-found: error
