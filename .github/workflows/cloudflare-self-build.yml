name: SARA free-model self-build

on:
  workflow_dispatch:
    inputs:
      objective:
        description: Bounded pure TypeScript skill objective (public if the draft is created)
        required: true
        type: string
      public_draft_approved:
        description: I approve publishing a verified candidate as a public draft PR
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - .github/sara/one-shot-opportunity-to-offer-v3

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sara-cloudflare-free-self-build
  cancel-in-progress: false

jobs:
  build-one-shadow-candidate:
    if: >-
      github.repository == 'BoneManTGRM/SARA' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.public_draft_approved == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out protected champion
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate, independently verify, and publish one SHADOW draft
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SARA_WORKERS_PLAN: free
          SARA_BUILD_OBJECTIVE: ${{ github.event_name == 'push' && 'Build a zero-cost Opportunity-to-Offer Compiler that accepts a public opportunity record and returns a structured owner-review work card containing fit score, disqualifying risks, required capabilities, estimated effort, evidence gaps, potential offer, and the safest next step. Use one clearly documented deterministic scoring formula. Before returning the candidate, manually dry-run every behavioral test against runSkill. Every expected result must exactly match every returned field, array, string, number, boolean, and null value. Do not return inconsistent test vectors. Use pure TypeScript with no imports, network, filesystem, secrets, timers, outreach, applications, contracts, spending, deployment, account creation, or payment activity. Verify independently and stop at SHADOW as a public draft pull request.' || inputs.objective }}
          SARA_PUBLIC_DRAFT_APPROVED: ${{ github.event_name == 'push' || inputs.public_draft_approved }}
        run: npm run executor:cloudflare
