name: SARA free-model self-build

on:
  workflow_dispatch:
    inputs:
      objective:
        description: Bounded pure TypeScript skill objective (public if the draft is created)
        required: true
        type: string
      public_draft_approved:
        description: I approve publishing a verified candidate as a public draft PR
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sara-cloudflare-free-self-build
  cancel-in-progress: false

jobs:
  build-one-shadow-candidate:
    if: github.repository == 'BoneManTGRM/SARA' && github.ref == 'refs/heads/main' && inputs.public_draft_approved == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out protected champion
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate, independently verify, and publish one SHADOW draft
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SARA_WORKERS_PLAN: free
          SARA_BUILD_OBJECTIVE: ${{ inputs.objective }}
          SARA_PUBLIC_DRAFT_APPROVED: ${{ inputs.public_draft_approved }}
        run: npm run executor:cloudflare
