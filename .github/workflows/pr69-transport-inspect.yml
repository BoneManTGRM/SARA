name: Inspect PR69 source transport bytes
on:
  push:
    branches: [integration/pr69-source-20260905-1626]
    paths: [.github/workflows/pr69-transport-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sha256sum integration/pr69-repair/*
      - uses: actions/upload-artifact@v4
        with:
          name: pr69-transport-inspection
          path: integration/pr69-repair/
          if-no-files-found: error
