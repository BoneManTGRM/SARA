name: Verify exact coding fastpath candidate
on:
  push:
    branches: [perf/coding-fastpath-20260906]
    paths: [.github/workflows/coding-fastpath-source-snapshot.yml]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'BoneManTGRM/SARA' && github.run_attempt == 1
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the unchanged digest-bound patch from its pinned transfer record
        run: |
          set -euo pipefail
          mkdir -p /tmp/sara-fastpath-transfer
          python3 - <<'PY'
          import subprocess,base64,gzip,hashlib,pathlib,re
          record=subprocess.check_output(['git','show','c305c7bc65e4f41874b03c08d5ade58bbccaed1f:.github/workflows/coding-fastpath-source-snapshot.yml'],text=True)
          encoded=re.search(r'^\s+PATCH_BASE64: ([A-Za-z0-9+/=]+)$',record,re.M).group(1)
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='8b4d9b3aee4d65b082ae8198a825a066480617ba60b2f1acb19ef04ea4005828'
          pathlib.Path('/tmp/sara-fastpath-transfer/candidate.patch').write_bytes(patch)
          PY
          git apply --index /tmp/sara-fastpath-transfer/candidate.patch
          git rm .github/workflows/coding-fastpath-source-snapshot.yml
          git write-tree | tee /tmp/sara-fastpath-transfer/tree-before-verify.txt
          test "$(git write-tree)" = b94620c87282e1381a8cfba566d48066e0f5ae0e
      - run: npm ci --ignore-scripts
      - name: Verify the exact candidate without provider credentials
        run: |
          set -euo pipefail
          npm run verify | tee /tmp/sara-fastpath-transfer/verify.log
          git diff --exit-code
          test "$(git write-tree)" = b94620c87282e1381a8cfba566d48066e0f5ae0e
      - name: Publish only this verified branch candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = BoneManTGRM/SARA
          test "$GITHUB_REF" = refs/heads/perf/coding-fastpath-20260906
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'SARA verified source transfer'
          git config user.email 'source-transfer@users.noreply.github.com'
          git commit -m 'Reject forbidden coding source before compilation; preserve fresh verification'
          test "$(git rev-parse HEAD^{tree})" = b94620c87282e1381a8cfba566d48066e0f5ae0e
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/perf/coding-fastpath-20260906
          unset AUTH GH_TOKEN
          git rev-parse HEAD > /tmp/sara-fastpath-transfer/commit.txt
          git rev-parse HEAD^{tree} > /tmp/sara-fastpath-transfer/tree.txt
          git archive --format=tar HEAD | gzip -n > /tmp/sara-fastpath-transfer/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sara-fastpath-transfer-${{ github.run_id }}
          path: /tmp/sara-fastpath-transfer/
          retention-days: 14
