name: Verify single-check coding verifier candidate
on:
  push:
    branches: [perf/coding-fastpath-20260906]
    paths: [.github/workflows/coding-fastpath-source-snapshot.yml]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'BoneManTGRM/SARA' && github.run_attempt == 1
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the exact candidate delta
        env:
          PATCH_BASE64: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = add77ea44d9a282975e132f6f836944bee5dae36
          mkdir -p /tmp/sara-single-check-transfer
          python3 - <<'PY'
          import os,base64,gzip,hashlib,pathlib
          patch=gzip.decompress(base64.b64decode(os.environ['PATCH_BASE64'],validate=True))
          assert hashlib.sha256(patch).hexdigest()=='198d15f2aa5a54416ec9d77a6e4bbbfeef7806cb56881a0b1acde46431c7143b'
          pathlib.Path('/tmp/sara-single-check-transfer/candidate.patch').write_bytes(patch)
          PY
          git apply --index /tmp/sara-single-check-transfer/candidate.patch
          git rm .github/workflows/coding-fastpath-source-snapshot.yml
          git write-tree | tee /tmp/sara-single-check-transfer/tree-before-verify.txt
          test "$(git write-tree)" = abb8462b296f5f375d1e50d52cf7c5e9b0faa4c6
      - run: npm ci --ignore-scripts
      - name: Verify the exact candidate without provider credentials
        run: |
          set -euo pipefail
          npm run verify | tee /tmp/sara-single-check-transfer/verify.log
          git diff --exit-code
          test "$(git write-tree)" = abb8462b296f5f375d1e50d52cf7c5e9b0faa4c6
      - name: Publish only the verified branch candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = BoneManTGRM/SARA
          test "$GITHUB_REF" = refs/heads/perf/coding-fastpath-20260906
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'SARA verified source transfer'
          git config user.email 'source-transfer@users.noreply.github.com'
          git commit -m 'Remove duplicate semantic compilation while retaining fresh isolated verification'
          test "$(git rev-parse HEAD^{tree})" = abb8462b296f5f375d1e50d52cf7c5e9b0faa4c6
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/perf/coding-fastpath-20260906
          unset AUTH GH_TOKEN
          git rev-parse HEAD > /tmp/sara-single-check-transfer/commit.txt
          git rev-parse HEAD^{tree} > /tmp/sara-single-check-transfer/tree.txt
          git archive --format=tar HEAD | gzip -n > /tmp/sara-single-check-transfer/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sara-single-check-transfer-${{ github.run_id }}
          path: /tmp/sara-single-check-transfer/
          retention-days: 14
