name: Repository executor qualification
on:
  push:
    branches: [feat/swe-repository-executor]
permissions:
  contents: read
jobs:
  docker-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --import tsx proof/repository-executor.ts
        env:
          SARA_REPOSITORY_PROOF_OUTPUT: ${{ github.workspace }}/repository-qualification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-executor-qualification
          path: repository-qualification/
          if-no-files-found: error
