name: Apply PR59 Telegram NICO integration v7

on:
  push:
    branches:
      - automation/export-sara-pr59-20260904
    paths:
      - .github/workflows/apply-pr59-telegram-nico-integration-v7.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apply-pr59-telegram-nico-integration
  cancel-in-progress: false

jobs:
  exact-repair-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/telegram-nico-gmail-delivery
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Fetch deterministic patch sources
        run: git fetch origin automation/export-sara-pr59-20260904

      - name: Reapply the bounded core patches idempotently
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, textwrap

          source = subprocess.check_output([
              "git", "show",
              "origin/automation/export-sara-pr59-20260904:.github/workflows/apply-pr59-telegram-nico-integration-v5.yml"
          ], text=True)
          match = re.search(r"      - name: Apply final bounded correctness patches\n        run: \|\n          python3 - <<'PY'\n(.*?)\n          PY\n", source, re.S)
          if not match:
              raise SystemExit("Unable to recover the bounded v5 patch")
          code = textwrap.dedent(match.group(1))
          exec(compile(code, "v5-bounded-patch", "exec"), {"__name__": "__main__"})
          PY

      - name: Apply activation and real-operator compatibility patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, textwrap

          source = subprocess.check_output([
              "git", "show",
              "origin/automation/export-sara-pr59-20260904:.github/workflows/apply-pr59-telegram-nico-integration-v6.yml"
          ], text=True)
          match = re.search(r"      - name: Add remaining bounded security regressions\n        run: \|\n          python3 - <<'PY'\n(.*?)\n          PY\n", source, re.S)
          if not match:
              raise SystemExit("Unable to recover the bounded v6 source patch")
          code = textwrap.dedent(match.group(1))
          exec(compile(code, "v6-source-patch", "exec"), {"__name__": "__main__"})

          for output, start, end in [
              (
                  "tests/telegram-nico-security-regressions.test.ts",
                  "          cat > tests/telegram-nico-security-regressions.test.ts <<'TS'\n",
                  "\n          TS\n",
              ),
              (
                  "docs/TELEGRAM_NICO_GMAIL_DELIVERY.md",
                  "          cat > docs/TELEGRAM_NICO_GMAIL_DELIVERY.md <<'MD'\n",
                  "\n          MD\n",
              ),
          ]:
              begin = source.find(start)
              if begin < 0:
                  raise SystemExit(f"Unable to recover {output}")
              begin += len(start)
              finish = source.find(end, begin)
              if finish < 0:
                  raise SystemExit(f"Unable to find the end of {output}")
              content = textwrap.dedent(source[begin:finish]) + "\n"
              Path(output).parent.mkdir(parents=True, exist_ok=True)
              Path(output).write_text(content)

          test = Path("tests/telegram-nico-security-regressions.test.ts")
          value = test.read_text().replace(
              'boundary.nicoOperator.createRun = async (...args: unknown[]) => {\n                started();\n                return originalCreate(...args);\n              };',
              'boundary.nicoOperator.createRun = async () => {\n                started();\n                return originalCreate();\n              };'
          )
          test.write_text(value)
          PY

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused security and existing NICO regression suite
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --import tsx --test \
            tests/telegram-nico-delivery.test.ts \
            tests/telegram-nico-delivery-workflow.test.ts \
            tests/telegram-nico-security-regressions.test.ts \
            tests/telegram-nico-http.test.ts \
            tests/telegram-nico-production.test.ts \
            tests/github-exact-target-verifier.test.ts \
            tests/nico-automated-package-verifier.test.ts \
            tests/gmail-oauth-activation.test.ts \
            tests/gmail-verified-report-sender.test.ts \
            tests/nico-operator.test.ts \
            tests/nico-http.test.ts \
            tests/revenue-pilot-operator.test.ts 2>&1 | tee focused.log

      - name: Run strict typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Run complete repository verification
        id: verify
        if: steps.focused.outcome == 'success' && steps.typecheck.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verify.log

      - name: Inspect exact final candidate
        id: review
        if: steps.focused.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.verify.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          git diff --check
          outside="$(git diff --name-only | awk '!/^(src|tests|docs)\// { count += 1 } END { print count + 0 }')"
          test "$outside" -eq 0
          ! grep -RIn --exclude-dir=node_modules --exclude='*.test.ts' 'beardedwarrior5161@gmail.com' src docs/TELEGRAM_NICO_GMAIL_DELIVERY.md
          ! grep -RIn --exclude-dir=node_modules --exclude='*.test.ts' -E '(gmail|google).*(password|app password)' src docs/TELEGRAM_NICO_GMAIL_DELIVERY.md
          ! grep -RIn --exclude-dir=node_modules -E 'console\.(log|error|warn).*(refreshToken|clientSecret|authorization)' src/gmail-*.ts src/telegram-nico-*.ts
          test "$(grep -RIl 'sara.reparodynamics@gmail.com' src | wc -l)" -gt 0
          test "$(grep -RIl 'reparodynamics@gmail.com' src | wc -l)" -gt 0

      - name: Upload exact logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr59-verification-logs-v7
          path: |
            focused.log
            typecheck.log
            verify.log
          if-no-files-found: warn
          retention-days: 3

      - name: Comment sanitized failure state
        if: steps.focused.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.verify.outcome != 'success' || steps.review.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'PR #59 exact integration gate failed closed. No candidate commit was pushed.'
            echo
            echo "Focused tests: ${{ steps.focused.outcome }}"
            echo "Typecheck: ${{ steps.typecheck.outcome }}"
            echo "Full verify: ${{ steps.verify.outcome }}"
            echo "Diff/security review: ${{ steps.review.outcome }}"
          } > failure.md
          gh pr comment 59 --body-file failure.md

      - name: Enforce every gate
        if: always()
        run: |
          test "${{ steps.focused.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.verify.outcome }}" = "success"
          test "${{ steps.review.outcome }}" = "success"

      - name: Commit and push only the verified tree
        run: |
          git config user.name "Reparodynamics"
          git config user.email "papadenico@yahoo.com"
          git add src tests docs/TELEGRAM_NICO_GMAIL_DELIVERY.md
          if git diff --cached --quiet; then
            echo "The exact verified tree is already on PR #59."
            exit 0
          fi
          git commit -m "Harden Telegram NICO delivery boundaries"
          git push origin HEAD:feature/telegram-nico-gmail-delivery
