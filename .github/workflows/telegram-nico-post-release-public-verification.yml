name: Telegram NICO post-release public verification

on:
  push:
    branches:
      - automation/pr59-production-wiring-final

permissions:
  contents: read
  deployments: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Wait for the exact final PR merge and successful production deployment record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: BoneManTGRM/SARA
          HEAD_BRANCH: feature/telegram-nico-gmail-delivery-final
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          pr=""
          for attempt in $(seq 1 120); do
            pulls="$(curl --fail --silent --show-error "${auth[@]}" "$api/pulls?state=closed&head=${REPOSITORY%%/*}:$HEAD_BRANCH&per_page=20")"
            pr="$(jq '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | last // empty' <<<"$pulls")"
            [ -n "$pr" ] && break
            sleep 15
          done
          test -n "$pr"
          pr_number="$(jq -r '.number' <<<"$pr")"
          pr_url="$(jq -r '.html_url' <<<"$pr")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          merged_sha="$(jq -r '.merge_commit_sha' <<<"$pr")"
          test "${#merged_sha}" = "40"

          deployment=""
          status=""
          for attempt in $(seq 1 160); do
            deployments="$(curl --fail --silent --show-error "${auth[@]}" "$api/deployments?sha=$merged_sha&per_page=100")"
            deployment="$(jq '[.[] | select((.environment | ascii_downcase) == "production" or (.environment | ascii_downcase | contains("production")))] | sort_by(.created_at) | last // empty' <<<"$deployments")"
            if [ -n "$deployment" ]; then
              deployment_id="$(jq -r '.id' <<<"$deployment")"
              statuses="$(curl --fail --silent --show-error "${auth[@]}" "$api/deployments/$deployment_id/statuses?per_page=100")"
              status="$(jq 'sort_by(.created_at) | last // empty' <<<"$statuses")"
              state="$(jq -r '.state // empty' <<<"$status")"
              if [ "$state" = "success" ]; then
                break
              fi
              case "$state" in error|failure|inactive) exit 1 ;; esac
            fi
            sleep 15
          done
          test -n "$deployment"
          test "$(jq -r '.state' <<<"$status")" = "success"
          deployment_id="$(jq -r '.id' <<<"$deployment")"
          deployment_status_id="$(jq -r '.id' <<<"$status")"
          deployment_url="$(jq -r '.environment_url // .target_url // empty' <<<"$status")"

          health_url=""
          health_status=""
          health_sha_seen=false
          for candidate in \
            "${deployment_url%/}/health" \
            "${deployment_url%/}/api/health" \
            "https://saraseed.app/health" \
            "https://saraseed.app/api/health" \
            "https://saraseed.app/"; do
            [ -n "$candidate" ] || continue
            for attempt in $(seq 1 20); do
              code="$(curl --location --silent --show-error --output /tmp/health-body --write-out '%{http_code}' --max-time 20 "$candidate" || true)"
              if [ "$code" = "200" ]; then
                health_url="$candidate"
                health_status="$code"
                if grep -Fqi "$merged_sha" /tmp/health-body || grep -Fqi "${merged_sha:0:12}" /tmp/health-body; then
                  health_sha_seen=true
                fi
                break 2
              fi
              sleep 10
            done
          done
          test "$health_status" = "200"

          jq -n \
            --arg schema "sara.telegram_nico.production_verification.v1" \
            --arg captured_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg pr_number "$pr_number" \
            --arg pr_url "$pr_url" \
            --arg head_sha "$head_sha" \
            --arg merged_sha "$merged_sha" \
            --arg deployment_id "$deployment_id" \
            --arg deployment_status_id "$deployment_status_id" \
            --arg deployment_state "$(jq -r '.state' <<<"$status")" \
            --arg deployment_environment "$(jq -r '.environment' <<<"$deployment")" \
            --arg deployment_url "$deployment_url" \
            --arg health_url "$health_url" \
            --arg health_status "$health_status" \
            --argjson health_sha_seen "$health_sha_seen" \
            '{schema:$schema,captured_at:$captured_at,pull_request:($pr_number|tonumber),pull_request_url:$pr_url,head_sha:$head_sha,merged_commit_sha:$merged_sha,deployment_id:($deployment_id|tonumber),deployment_status_id:($deployment_status_id|tonumber),deployment_state:$deployment_state,deployment_environment:$deployment_environment,deployment_url:$deployment_url,health_url:$health_url,health_http_status:($health_status|tonumber),health_body_exposed_exact_commit:$health_sha_seen,exact_commit_proven_by_deployment_record:true}' \
            > telegram-nico-production-verification.json

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-nico-production-verification
          path: telegram-nico-production-verification.json
          if-no-files-found: error
          retention-days: 30
