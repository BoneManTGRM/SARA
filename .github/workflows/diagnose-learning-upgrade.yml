name: Diagnose bounded learning upgrade

on:
  push:
    branches:
      - codex/learning-capacity-quality-20260910

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[learning-upgrade-diagnostic]') && !contains(github.event.head_commit.message, '[learning-upgrade-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/learning-capacity-quality-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reproduce source transformation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          source = Path('.github/workflows/apply-learning-capacity-quality.yml').read_text()
          match = re.search(r"run: \|\n          python3 <<'PY'\n(.*?)\n          PY", source, re.S)
          if not match:
              raise SystemExit('Could not extract source transformation script.')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in match.group(1).splitlines())
          Path('/tmp/learning-transform.py').write_text(script)
          PY
          python3 /tmp/learning-transform.py
      - name: Capture verification results
        shell: bash
        run: |
          set +e
          npm test > /tmp/test.log 2>&1
          TEST_STATUS=$?
          npm run typecheck > /tmp/typecheck.log 2>&1
          TYPE_STATUS=$?
          {
            echo "test_status=${TEST_STATUS}"
            echo "typecheck_status=${TYPE_STATUS}"
            echo
            echo "=== npm test ==="
            tail -n 500 /tmp/test.log
            echo
            echo "=== npm run typecheck ==="
            tail -n 500 /tmp/typecheck.log
          } > .learning-upgrade-diagnostic.txt
          if [ "$TEST_STATUS" -eq 0 ] && [ "$TYPE_STATUS" -eq 0 ]; then
            echo "ALL_VERIFICATION_PASSED" >> .learning-upgrade-diagnostic.txt
          fi
      - name: Commit diagnostic only
        shell: bash
        run: |
          git config user.name "Reparodynamics"
          git config user.email "papadenico@yahoo.com"
          git add -f .learning-upgrade-diagnostic.txt
          git commit -m "diagnostic: learning upgrade verification [learning-upgrade-diagnostic]"
          git push origin HEAD:codex/learning-capacity-quality-20260910
